<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hibi</title>
<meta name="description" content="日々, jour après jour. Dix minutes par jour pour garder l'esprit vif après 40 ans.">
<meta name="theme-color" content="#F4F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hibi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500;600;700&display=swap">
<style>
/* Hibi · épure. Une colonne calme (34rem), un seul objet par écran, monochrome, couleur réservée aux capacités.
   Thèmes : clair (jour), sombre, soir (sombre chaud, après 20 h). */
:root{
  --bg:#F4F4F2; --surface:#FFFFFF; --tint:#EBEBE8; --line:#E0E0DC;
  --ink:#1D1D1F; --muted:#66666B;
  --accent:#1D1D1F; --accent-ink:#FFFFFF; --accent2:#E0601F; --warm:#E0601F;
  --good:#2E8B57; --bad:#D14B36; --up:#1E7A45; --down:#B8402C;
  /* capacités : quatre clartés distinctes */
  --k-ufov:#E0601F; --k-corsi:#34349E; --k-switch:#137A6B; --k-list:#9C2B5E; --k-ink:#FFFFFF;
  /* courbes famille */
  --s1:#1D1D1F; --s2:#E0601F; --s3:#34349E; --s4:#137A6B; --s5:#9C2B5E; --s6:#8E8E93;
  /* disque d'aluminium */
  --m1:#E6E6E3; --m2:#FBFBFA; --m3:#D8D8D4; --m4:#F6F6F4; --m5:#DEDEDA;
  --lift:0 1px 2px rgba(20,20,20,.05),0 10px 28px rgba(20,20,20,.05);
  --display:"Hanken Grotesk",system-ui,-apple-system,sans-serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0B0C; --surface:#161618; --tint:#1F1F22; --line:#2C2C2F;
  --ink:#F5F5F7; --muted:#98989D;
  --accent:#F5F5F7; --accent-ink:#0B0B0C; --accent2:#FF6A3D; --warm:#FF6A3D;
  --good:#5DD39E; --bad:#FF7A66; --up:#5DD39E; --down:#FF7A66;
  --k-ufov:#F0703C; --k-corsi:#A7A6FF; --k-switch:#7FE3D2; --k-list:#C24D7E; --k-ink:#0B0B0C;
  --s1:#F5F5F7; --s2:#F0703C; --s3:#A7A6FF; --s4:#7FE3D2; --s5:#C24D7E; --s6:#8E8E93;
  --m1:#2A2A2D; --m2:#3B3B3F; --m3:#1E1E21; --m4:#37373A; --m5:#242427;
  --lift:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B0B0C; --surface:#161618; --tint:#1F1F22; --line:#2C2C2F;
  --ink:#F5F5F7; --muted:#98989D;
  --accent:#F5F5F7; --accent-ink:#0B0B0C; --accent2:#FF6A3D; --warm:#FF6A3D;
  --good:#5DD39E; --bad:#FF7A66; --up:#5DD39E; --down:#FF7A66;
  --k-ufov:#F0703C; --k-corsi:#A7A6FF; --k-switch:#7FE3D2; --k-list:#C24D7E; --k-ink:#0B0B0C;
  --s1:#F5F5F7; --s2:#F0703C; --s3:#A7A6FF; --s4:#7FE3D2; --s5:#C24D7E; --s6:#8E8E93;
  --m1:#2A2A2D; --m2:#3B3B3F; --m3:#1E1E21; --m4:#37373A; --m5:#242427;
  --lift:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark }
:root[data-theme="dark"].soir{
  --bg:#100E0C; --surface:#1A1815; --tint:#24211D; --line:#33302B;
  --ink:#EFE8DD; --muted:#A39A8F;
  --accent:#EFE8DD; --accent-ink:#100E0C; --accent2:#F08A4B; --warm:#F08A4B;
  --good:#8CC79A; --bad:#E8836F; --up:#8CC79A; --down:#E8836F;
  --k-ufov:#E8834A; --k-corsi:#B9A5E8; --k-switch:#9ED9B8; --k-list:#B85A72; --k-ink:#100E0C;
  --s1:#EFE8DD; --s2:#E8834A; --s3:#B9A5E8; --s4:#9ED9B8; --s5:#B85A72; --s6:#9A9187;
  --m1:#2B2824; --m2:#3A3631; --m3:#201D1A; --m4:#36322D; --m5:#26231F; color-scheme:dark }

/* base */
html{font-size:18px}
html[data-size="normal"]{font-size:16px}
html[data-size="grand"]{font-size:18px}
html[data-size="tresgrand"]{font-size:21px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.55;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
a{color:var(--accent)}
p{margin:0}
.wrap{max-width:34rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(1.25rem + env(safe-area-inset-top,0px)) calc(7rem + env(safe-area-inset-bottom,0px))}
body.playing .wrap{padding-bottom:calc(2rem + env(safe-area-inset-bottom,0px))}

/* typographie */
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2.1rem;font-weight:600;letter-spacing:-.03em}
h2{font-size:1.55rem;font-weight:600;letter-spacing:-.02em}
h3,h2.h3{font-size:1.08rem;font-weight:600;letter-spacing:-.01em}
h1.h2{font-size:1.55rem;font-weight:600;letter-spacing:-.02em}
.eyebrow{font-size:.9rem;font-weight:400;letter-spacing:0;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.num{font-variant-numeric:tabular-nums}
.jp{color:var(--muted);letter-spacing:0}
.big{font-family:var(--display);font-size:4.6rem;font-weight:200;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.unit{font-family:var(--body);font-size:1.1rem;font-weight:400;color:var(--muted);margin-left:.35rem}
.digit{font-family:var(--display);font-size:5.5rem;font-weight:200;letter-spacing:-.04em;line-height:1}
.word{font-family:var(--display);font-size:2.2rem;font-weight:400;letter-spacing:-.02em;line-height:1.15}
.up{color:var(--up)} .down{color:var(--down)}
.err{color:var(--bad);font-weight:700}
.delta{color:var(--muted)}
ul.plain{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:.35rem}
.steps{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.5rem}
.st-on{font-weight:600;display:inline-flex;align-items:center;gap:.4rem}
.st-on::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:var(--accent2)}
details summary{list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+ ";color:var(--muted)}
details[open] summary::before{content:"− "}

/* mise en page */
.stack{display:flex;flex-direction:column;gap:1rem}
.stack-lg{display:flex;flex-direction:column;gap:2.6rem}
.hhead{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.confirm{display:flex;flex-direction:column;gap:.6rem}

/* surfaces : blanches, sans bordure, posées par une ombre douce */
.card,.tile2,.bigcard,.codebox{border:0;border-radius:24px;background:var(--surface);box-shadow:var(--lift)}
.card{padding:1.25rem}
.ma{padding:1.5rem 1.3rem}
.illu{display:grid;place-items:center;border-radius:28px;padding:1rem;background:var(--surface)!important;box-shadow:var(--lift)}
.illu svg{width:100%;max-width:15rem;height:auto}

/* boutons */
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--warm);outline-offset:3px}
.btn{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;min-height:3.6rem;border-radius:99px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:500;font-size:1.05rem;letter-spacing:-.005em;padding:.6rem 1rem}
a.btn{text-decoration:none}
.hero .btn{background:var(--ink);color:var(--bg)}
.btn.ghost,.btn.quiet{background:var(--tint);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
.linkbtn{background:none;border:0;color:var(--ink);font-weight:500;padding:.5rem 0;min-height:2.75rem}
.seg,.tabs2{display:grid;gap:.4rem;background:var(--tint);padding:.3rem;border-radius:99px}
.seg{grid-auto-flow:column;grid-auto-columns:1fr}
.tabs2{grid-template-columns:1fr 1fr}
.seg button,.tabs2 button{border:0;background:none;border-radius:99px;min-height:2.9rem;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"],.tabs2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* formulaires */
label.f{display:flex;flex-direction:column;gap:.35rem;font-weight:700}
input.t{font:inherit;font-weight:400;min-height:3.2rem;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.5rem .85rem;width:100%}
input.t:focus{outline:3px solid var(--warm);outline-offset:2px}
input.code{text-transform:uppercase;letter-spacing:.18em;font-variant-numeric:tabular-nums;font-weight:700}

/* accueil : le disque, le plan du jour */
.hero{display:flex;flex-direction:column;gap:1.6rem}
.herotop{display:flex;flex-direction:column;align-items:center;gap:1.6rem}
.ringwrap{flex:none;color:var(--ink)}
.disc{position:relative;border-radius:50%;max-width:100%;background:conic-gradient(from 200deg,var(--m1),var(--m2) 18%,var(--m3) 40%,var(--m4) 62%,var(--m5) 82%,var(--m1));box-shadow:0 34px 60px rgba(20,20,20,.10),0 2px 4px rgba(20,20,20,.06),inset 0 1px 1px rgba(255,255,255,.7)}
.disc-in{position:absolute;inset:7.5%;border-radius:50%;background:var(--bg);box-shadow:inset 0 2px 7px rgba(0,0,0,.10),inset 0 -1px 1px rgba(255,255,255,.5)}
.disc svg{position:absolute;inset:0;width:100%;height:100%}
.plan{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.plan li{display:flex;align-items:center;gap:.8rem;border-top:1px solid var(--line);padding:.95rem 0}
.plan li:last-child{border-bottom:1px solid var(--line)}
.plan li.ok strong{color:var(--muted);font-weight:500;text-decoration:line-through;text-decoration-thickness:1px}
.plan li.ok .pi{opacity:.45}
.plan .pt{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.3}
.plan .pt span{font-size:.88rem;color:var(--muted)}
.plan .pdone{font-size:.85rem;color:var(--muted)}

/* marque de capacité : un point de couleur */
.pi{display:inline-grid;width:.6rem;height:.6rem;border-radius:50%;flex:none}
.pi.lg{width:.8rem;height:.8rem}
.gname{display:flex;align-items:center;gap:.7rem}

/* semaine et calendrier */
.week{display:flex;justify-content:space-between;gap:.4rem}
.day{display:flex;flex-direction:column;align-items:center;gap:.3rem;flex:1}
.day i{width:.75rem;height:.75rem;border-radius:50%;border:1px solid var(--muted)}
.day.on i{background:var(--ink);border-color:var(--ink)}
.day.kin i{border-color:var(--line);background:color-mix(in srgb,#B8913A 8%,transparent)}
.day.today i{border-color:var(--accent2);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent2) 28%,transparent)}
.day small{font-size:.75rem;color:var(--muted);font-weight:500}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:.35rem}
.cal i{aspect-ratio:1;border-radius:50%;background:var(--tint)}
.cal i.on{background:var(--ink)}

/* listes */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:1rem;padding:.9rem 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;min-height:4rem}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block}
.row .t span{color:var(--muted);font-size:.88rem}
.pairs{display:flex;flex-direction:column}
.pair{padding:.85rem 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:.25rem}
.pair:first-child{border-top:0;padding-top:0}
.pair .q{color:var(--muted);font-size:.92rem}
.pair .a{font-weight:700}

/* tuiles d'exercices */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.tile2{display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;text-align:left;padding:1.1rem;min-height:9rem;min-width:0}
.tile2 .pi{margin-bottom:.6rem}
.tile2 b{font-size:1.02rem}
.tile2 .lvl{margin-top:auto;font-size:.8rem;font-weight:700;color:var(--muted)}
.tile2:active{background:var(--tint)}

/* profil cognitif */
.profhead{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.profhead>div:first-child{min-width:0}
.bignum{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.bignum span{font-family:var(--display);font-size:2.4rem;font-weight:200;letter-spacing:-.04em;line-height:1}
.bignum small{color:var(--muted);font-weight:500;font-size:.8rem}
.bars{display:flex;flex-direction:column;gap:.8rem}
.bar{display:flex;flex-direction:column;gap:.3rem}
.bl{display:flex;justify-content:space-between;align-items:baseline;gap:.75rem}
.bl>span.num{white-space:nowrap}
.bn{display:inline-flex;align-items:center;gap:.5rem;font-weight:500;min-width:0}
.bn i{width:.55rem;height:.55rem;border-radius:50%;flex:none}
.bt{position:relative;height:.3rem;border-radius:99px;background:var(--line)}
.bt.lg{height:.45rem}
.bt>span{display:block;height:100%;border-radius:99px}
.bt em{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1.5px;background:var(--ink);border-radius:2px;opacity:.65}
@keyframes grow{from{width:0}}
.chart svg{width:100%;height:auto;display:block}
.donehead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.4rem}
.ringbig{color:var(--ink);margin-bottom:.4rem}

/* famille */
.codebox{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:.8rem 1rem}
.codebox b{font-size:1.35rem;letter-spacing:.16em;font-variant-numeric:tabular-nums;user-select:all}
.mem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.45rem 1rem;align-items:center;padding:.8rem 0;border-top:1px solid var(--line)}
.mem:first-child{border-top:0;padding-top:0}
.mem .nm{display:flex;align-items:center;gap:.5rem;font-weight:700;min-width:0}
.mem .nm i{width:.8rem;height:.8rem;border-radius:50%;flex:none}
.mem .wk{grid-column:1/-1;display:flex;gap:.3rem}
.mem .wk span{flex:1;height:.35rem;border-radius:99px;background:var(--tint)}
.mem .wk span.on{background:var(--accent)}
.you{font-size:.72rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:0 .4rem}
.legend2{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-size:.85rem}
.legend2 span{display:inline-flex;align-items:center;gap:.35rem}
.legend2 i{width:.55rem;height:.55rem;border-radius:50%}

/* accueil premier lancement */
.ob{padding-top:.5rem}
.obdots{display:flex;gap:.4rem}
.obdots i{width:.55rem;height:.55rem;border-radius:50%;background:var(--line)}
.obdots i.on{background:var(--accent);width:1.4rem;border-radius:99px}
.obart{display:flex}
.obart img{border-radius:22%;box-shadow:var(--lift)}
.obl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1rem}
.obl li{display:flex;gap:.9rem;align-items:flex-start}

/* navigation */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(22px);backdrop-filter:saturate(1.8) blur(22px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:34rem;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.55rem 0 .6rem;min-height:3.6rem;min-width:0;color:var(--muted);font-size:.72rem;font-weight:500}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs svg{width:1.45rem;height:1.45rem;stroke-width:1.5}
body.playing nav.tabs{display:none}

/* exercices */
.gtop{display:flex;justify-content:space-between;align-items:center;min-height:2.75rem}
.gtop span{color:var(--muted);font-weight:700;font-size:.9rem}
#msg{font-size:1.1rem;min-height:3.3rem}
#stage{transition:box-shadow .2s}
#stage.ok,#stage.bad{border-radius:28px}
#stage.ok{box-shadow:0 0 0 4px var(--good)}
#stage.bad{box-shadow:0 0 0 4px var(--bad)}
#controls{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;min-height:4.2rem}
#controls .one{grid-column:1/-1}
.choice{min-height:4.2rem;border:0;border-radius:20px;background:var(--surface);box-shadow:var(--lift);font-weight:500;font-size:1.1rem;display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.5rem}
.choice:active{background:var(--tint);transform:scale(.98)}
#fb{min-height:1.6rem;text-align:center;font-weight:700}
#fb.ok{color:var(--good)} #fb.bad{color:var(--bad)}
.timebar{height:3px;background:var(--tint);border-radius:3px;overflow:hidden}
.timebar.off{visibility:hidden}
.timebar i{display:block;height:100%;width:100%;background:var(--accent2);animation:drain linear forwards}
@keyframes drain{from{width:100%}to{width:0}}

/* champ visuel */
.ufov{position:relative;width:100%;max-width:22rem;aspect-ratio:1;margin:0 auto;border-radius:50%;background:var(--surface);box-shadow:inset 0 2px 10px rgba(0,0,0,.07);overflow:hidden}
.slot{position:absolute;transform:translate(-50%,-50%);width:15%;aspect-ratio:1;display:grid;place-items:center}
.slot svg{width:100%;height:100%}
.slot button{width:100%;height:100%;border-radius:50%;border:2.5px dashed var(--accent);background:var(--surface)}
.cross{font-family:var(--display);font-size:2rem;color:var(--muted)}
.maskch{position:absolute;transform:translate(-50%,-50%);color:var(--muted);font-size:1.4rem;line-height:1}

/* séquence */
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;max-width:21rem;margin:0 auto}
.tile{aspect-ratio:1;border:0;border-radius:20px;background:var(--surface);box-shadow:var(--lift);transition:background .12s}
.tile.wrong{background:var(--bad)}
.tile.lit{background:var(--accent2)}
.tile.tap{background:var(--ink)}
.tile:disabled{cursor:default}

/* aiguillage : règle en liseré de couleur, carte pleine */
.rule{border-radius:14px;padding:.7rem 1rem;text-align:center;font-weight:500;font-size:1.05rem;letter-spacing:.01em;background:var(--surface);color:var(--ink)}
.rule.par{box-shadow:inset 0 0 0 2px var(--k-switch),var(--lift)}
.rule.mag{box-shadow:inset 0 0 0 2px var(--k-ufov),var(--lift)}
.rule.let{box-shadow:inset 0 0 0 2px var(--k-corsi),var(--lift)}
.bigcard{display:grid;place-items:center;min-height:12rem;gap:.5rem;padding:1rem;text-align:center}
.rc{position:relative;transition:background .15s}
.rc.par,.lg.par{background:var(--k-switch);color:var(--k-ink)}
.rc.mag,.lg.mag{background:var(--k-ufov);color:var(--k-ink)}
.rc.let,.lg.let{background:var(--k-corsi);color:var(--k-ink)}
.rsym{position:absolute;top:.7rem;left:.9rem;font-size:1.2rem}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem 1rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.lg{display:inline-grid;place-items:center;width:1.5rem;height:1.5rem;border-radius:6px;font-size:.8rem}

@media (max-width:360px){.tiles{grid-template-columns:1fr}}
/* mouvement : doux, court, jamais pendant un stimulus. Désactivé si l'appareil demande moins d'animations. */
:root{--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.45,.64,1)}
@media (prefers-reduced-motion: no-preference){
 body{transition:background-color .4s var(--ease),color .4s var(--ease)}
 /* entrée d'écran : chaque bloc monte et apparaît, en cascade */
 #view.enter>*>*{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
 #view.enter .plan li{animation:rise .55s var(--ease) both}
 #view.enter .plan li:nth-child(1){animation-delay:.28s} #view.enter .plan li:nth-child(2){animation-delay:.34s}
 #view.enter .plan li:nth-child(3){animation-delay:.40s} #view.enter .plan li:nth-child(4){animation-delay:.46s}
 @keyframes rise{from{opacity:0;transform:translateY(12px)}}
 /* le disque se pose, l'arc se trace, le point orange suit la pointe */
 #view.enter .disc{animation:settle .9s var(--ease) both}
 @keyframes settle{from{opacity:0;transform:scale(.94)}}
 .ringarc{animation:arc 1.3s var(--ease) .2s both}
 @keyframes arc{from{stroke-dasharray:0 4000}}
 .ringdot{transform-box:view-box;animation:orbit 1.3s var(--ease) .2s both}
 @keyframes orbit{from{transform:rotate(var(--from))}}
 /* barres et courbes */
 .bt>span{animation:grow 1s var(--ease) .25s both}
 .bar:nth-child(2) .bt>span{animation-delay:.32s} .bar:nth-child(3) .bt>span{animation-delay:.39s} .bar:nth-child(4) .bt>span{animation-delay:.46s}
 .chart .ln,.ln{stroke-dasharray:1;animation:draw 1.2s var(--ease) .2s both}
 @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
 .chart .ar{animation:fade .8s var(--ease) .7s both}
 .chart circle{transform-box:fill-box;transform-origin:center;animation:dot .4s var(--spring) both;animation-delay:calc(.25s + var(--k,0)*70ms)}
 @keyframes fade{from{opacity:0}}
 @keyframes dot{from{opacity:0;transform:scale(0)}}
 /* semaine : les points se remplissent un à un, aujourd'hui respire une fois */
 #view.enter .day.on i{animation:dot .45s var(--spring) both;animation-delay:calc(.2s + var(--d,0)*50ms)}
 #view.enter .day.today i{animation:breathe 2.4s var(--ease) .6s both}
 @keyframes breathe{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent2) 0%,transparent)}45%{box-shadow:0 0 0 9px color-mix(in srgb,var(--accent2) 18%,transparent)}100%{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent2) 28%,transparent)}}
 /* toucher : légère pression, retour avec un ressort */
 .btn,.tile2,.row,.choice,.seg button,.tabs2 button,.linkbtn{transition:transform .45s var(--spring),background-color .25s var(--ease),color .25s var(--ease),box-shadow .25s var(--ease)}
 .btn:active,.tile2:active,.row:active{transform:scale(.97);transition-duration:.1s}
 .seg button:active,.tabs2 button:active,.linkbtn:active{transform:scale(.95);transition-duration:.1s}
 .choice:active{transition-duration:.1s}
 nav.tabs button{transition:color .3s var(--ease)}
 nav.tabs svg{transition:transform .45s var(--spring)}
 nav.tabs button:active svg{transform:scale(.88);transition-duration:.1s}
 nav.tabs button[aria-current="page"] svg{animation:pop .5s var(--spring)}
 @keyframes pop{40%{transform:scale(1.16)}}
 /* exercices : seul le retour « Juste » s'anime, après la réponse */
 #fb.ok,#fb.bad{animation:fb .35s var(--spring)}
 @keyframes fb{from{opacity:0;transform:translateY(4px) scale(.96)}}
 #stage{transition:box-shadow .3s var(--ease)}
 details>*:not(summary){animation:rise .4s var(--ease)}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap"><main id="view" aria-live="polite"></main></div>

<nav class="tabs" aria-label="Navigation">
  <div class="in">
    <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>Aujourd'hui</button>
    <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18l6-6 4 4 8-9"/><path d="M15 7h6v6"/></svg>Progrès</button>
    <button data-tab="famille"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9.5" r="2.4"/><path d="M3 19c.6-3.3 3-5 6-5s5.4 1.7 6 5M15.5 14.2c2.6-.4 4.8 1 5.5 4.3"/></svg>Famille</button>
    <button data-tab="science"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h11a5 5 0 0 1 5 5v9H9a5 5 0 0 1-5-5z"/><path d="M8 10h8M8 14h5"/></svg>Science</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Réglages</button>
  </div>
</nav>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const view=$("#view");
const KEY="vivace-v1";

function fresh(){return {settings:{size:"grand",pace:"calme",theme:"auto",voice:"off"},levels:{ufov:500,corsi:3,list:6,switch:1,swVis:1600},history:[],days:{},family:null,pending:[],bilans:[],today:null,name:"",onboarded:false}}
function load(){try{const r=JSON.parse(localStorage.getItem(KEY)||"null");if(r&&r.levels&&r.settings){r.history=r.history.filter(h=>h.g!=="switch"||h.v===2);r.levels.switch=r.levels.switch||1;r.family=r.family||null;r.pending=r.pending||[];r.bilans=r.bilans||[];r.settings.theme=r.settings.theme||"auto";r.settings.voice=r.settings.voice||"off";return r}}catch(e){}return fresh()}
function save(){D.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}accountSoon()}
let D=load();
document.documentElement.dataset.size=D.settings.size;

const dkey=d=>{const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())};
const today=()=>dkey(new Date());
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const avg=a=>a.reduce((s,x)=>s+x,0)/(a.length||1);
const fmt=n=>new Intl.NumberFormat("fr-FR").format(n);
const calm=()=>D.settings.pace==="calme";


const GAMES={
 ufov:{name:"Champ visuel",skill:"Vitesse de traitement",better:"lower",unit:"ms",
   steps:["Fixez la croix au centre.","Une forme apparaît au centre, et une étoile sur le pourtour, très brièvement.","Dites quelle forme était au centre, puis touchez l'endroit où était l'étoile."],
   why:"C'est le type d'exercice le mieux étudié chez les plus de 60 ans. Le temps d'affichage raccourcit quand vous réussissez, et s'allonge quand vous ratez.",
   illu:'<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="var(--surface)" stroke="var(--line)"/><circle cx="100" cy="100" r="16" fill="var(--ink)"/><polygon points="170,62 175,74 188,75 178,83 181,96 170,89 159,96 162,83 152,75 165,74" fill="var(--warm)"/></svg>'},
 corsi:{name:"Séquence",skill:"Mémoire de travail",better:"higher",unit:"cases",
   steps:["Des cases s'allument l'une après l'autre.","Quand c'est à vous, touchez-les dans le même ordre.","Chaque réussite ajoute une case. Deux erreurs de suite terminent l'exercice."],
   why:"Retenir et manipuler quelques éléments à la fois sert tous les jours : un code, un itinéraire, une liste d'étapes.",
   illu:'<svg viewBox="0 0 200 200"><g fill="var(--surface)" stroke="var(--line)" stroke-width="2"><rect x="20" y="20" width="48" height="48" rx="10"/><rect x="76" y="20" width="48" height="48" rx="10"/><rect x="132" y="20" width="48" height="48" rx="10" fill="var(--warm)" stroke="var(--warm)"/><rect x="20" y="76" width="48" height="48" rx="10"/><rect x="76" y="76" width="48" height="48" rx="10"/><rect x="132" y="76" width="48" height="48" rx="10"/><rect x="20" y="132" width="48" height="48" rx="10" fill="var(--warm)" stroke="var(--warm)"/><rect x="76" y="132" width="48" height="48" rx="10"/><rect x="132" y="132" width="48" height="48" rx="10"/></g><text x="156" y="51" text-anchor="middle" font-size="20" font-weight="700" fill="var(--surface)">1</text><text x="44" y="163" text-anchor="middle" font-size="20" font-weight="700" fill="var(--surface)">2</text></svg>'},
 switch:{name:"Aiguillage",skill:"Flexibilité mentale",better:"higher",unit:"points",
   steps:["Un chiffre s'affiche avec une règle : « pair ou impair ? » ou « plus ou moins que 5 ? ». La règle change sans prévenir.","Six niveaux : une lettre et une troisième règle s'ajoutent, puis la règle n'est plus donnée que par la couleur de la carte, et la carte s'efface de plus en plus vite.","Tous les 8 essais, vous montez si vous êtes presque sans faute, et redescendez en cas de difficulté."],
   why:"Passer d'une règle à l'autre est une des capacités qui ralentit le plus avec l'âge. Garder en tête la règle et l'information après qu'elles ont disparu fait travailler la mémoire de travail en même temps.",
   illu:'<svg viewBox="0 0 200 200"><rect x="20" y="20" width="160" height="34" rx="9" fill="var(--warm)"/><text x="100" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="var(--surface)" textLength="140" lengthAdjust="spacingAndGlyphs" font-family="Atkinson Hyperlegible, system-ui, sans-serif">PLUS OU MOINS QUE 5 ?</text><rect x="20" y="64" width="160" height="116" rx="16" fill="var(--surface)" stroke="var(--line)"/><text x="100" y="150" text-anchor="middle" font-size="76" font-weight="800" fill="var(--ink)" font-family="Bricolage Grotesque, system-ui, sans-serif">7</text></svg>'},
 list:{name:"Liste de courses",skill:"Mémoire des événements",better:"higher",unit:"mots",
   steps:["Une liste de courses défile, un article à la fois.","Ensuite, des articles s'affichent : étaient-ils sur la liste ?","La liste s'allonge quand vous réussissez bien."],
   why:"Des mots du quotidien, pas de vocabulaire rare. Le score compte les bonnes reconnaissances moins les fausses alertes.",
   illu:'<svg viewBox="0 0 200 200"><rect x="40" y="16" width="120" height="168" rx="12" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/><g font-size="16" fill="var(--ink)"><text x="58" y="56">Poireaux</text><text x="58" y="88">Beurre</text><text x="58" y="120">Citron</text><text x="58" y="152" fill="var(--muted)">…</text></g><path d="M58 64h70M58 96h52M58 128h56" stroke="var(--line)"/></svg>'}
};

const WORDS=["Pommes","Poireaux","Beurre","Farine","Yaourts","Café","Thé","Riz","Lentilles","Carottes","Oignons","Ail","Citron","Oranges","Bananes","Fromage","Jambon","Poulet","Saumon","Œufs","Lait","Pain","Confiture","Miel","Chocolat","Biscuits","Pâtes","Tomates","Courgettes","Salade","Persil","Basilic","Moutarde","Vinaigre","Huile d'olive","Sel","Poivre","Sucre","Crème","Épinards","Champignons","Poivrons","Avocat","Kiwis","Fraises","Raisin","Noix","Amandes","Olives","Thon","Sardines","Cornichons","Petits pois","Haricots verts","Pommes de terre","Concombre","Radis","Lessive","Éponges","Savon","Dentifrice","Bougies","Ampoules","Piles","Papier toilette","Clémentines","Poires","Cacao","Semoule","Brioche"];

/* ---------- navigation ---------- */
let runId=0, session=null;
const alive=id=>id===runId;
function setTab(t){document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===t?"page":"false"))}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>{({home,progress,famille,science,settings})[b.dataset.tab]()}));
const MOTION=()=>!matchMedia("(prefers-reduced-motion: reduce)").matches;
function show(html,tab){runId++;hush();document.body.classList.remove("playing");if(tab)setTab(tab);
 view.classList.remove("enter");view.innerHTML=html;window.scrollTo(0,0);
 if(MOTION()){const r=view.firstElementChild;if(r)[...r.children].forEach((c,i)=>c.style.setProperty("--i",Math.min(i,8)));
  view.querySelectorAll(".day.on").forEach((d,i)=>d.style.setProperty("--d",i));
  void view.offsetWidth;view.classList.add("enter")}
 countUp(view);
}
// chiffres qui défilent jusqu'à leur valeur (format identique à l'affichage final)
function countUp(root){
 if(!MOTION())return;
 root.querySelectorAll("[data-count]").forEach(el=>{
  const to=+el.dataset.count,f=el.dataset.fmt?fmt:(v=>String(Math.round(v)));if(!isFinite(to)||to===0)return;
  const dec=(String(to).split(".")[1]||"").length,t0=performance.now(),dur=1100,delay=200;
  const tick=now=>{const x=Math.min(1,Math.max(0,(now-t0-delay)/dur)),e=1-Math.pow(1-x,3),v=to*e;
   el.textContent=f(dec?+v.toFixed(dec):Math.round(v));if(x<1&&el.isConnected)requestAnimationFrame(tick);else el.textContent=f(to)};
  el.textContent=f(0);requestAnimationFrame(tick);
 });
}

/* ---------- week ---------- */
function weekDays(){const n=new Date();const off=(n.getDay()+6)%7;const m=new Date(n.getFullYear(),n.getMonth(),n.getDate()-off);return Array.from({length:7},(_,i)=>new Date(m.getFullYear(),m.getMonth(),m.getDate()+i))}
function weekHTML(){const L=["L","M","M","J","V","S","D"];const t=today();
 return '<div class="week" role="list">'+weekDays().map((d,i)=>{const k=dkey(d);const on=!!D.days[k];return `<div class="day${on?" on":""}${!on&&k<t?" kin":""}${k===t?" today":""}" role="listitem" aria-label="${d.toLocaleDateString("fr-FR",{weekday:"long"})}${on?", séance faite":""}"><i></i><small>${L[i]}</small></div>`}).join("")+"</div>"}
function weekCount(){return weekDays().filter(d=>D.days[dkey(d)]).length}

/* ---------- profil & plan du jour ---------- */
const KCOL={ufov:"var(--k-ufov)",corsi:"var(--k-corsi)",switch:"var(--k-switch)",list:"var(--k-list)"};
const GKEYS=["ufov","corsi","switch","list"];
function played(g){return D.history.some(h=>h.g===g)}
function idx(g){const L=D.levels;let v;
 if(g==="ufov")v=(800-L.ufov)/760*100;
 else if(g==="corsi")v=(L.corsi-2)/7*100;
 else if(g==="switch"){const lv=L.switch||1;v=(lv-1)/5*85+(lv>=4?clamp((1600-(L.swVis||1600))/1300,0,1)*15:0)}
 else v=(L.list-4)/12*100;
 return Math.round(clamp(v,0,100))}
const rating=v=>v<25?"Débutant":v<50?"Intermédiaire":v<75?"Avancé":"Expert";
function overall(){const p=GKEYS.filter(played);return p.length?Math.round(avg(p.map(idx))):null}
function sessionOrder(){const rest=["corsi","switch","list"];const n=Math.floor(Date.now()/864e5)%3;let r=rest.slice(n).concat(rest.slice(0,n));
 if(rest.every(played)){const w=rest.reduce((a,b)=>idx(b)<idx(a)?b:a);r=[w].concat(r.filter(x=>x!==w))}
 return ["ufov"].concat(r)}
function todayPlan(){if(!D.today||D.today.d!==today()){D.today={d:today(),order:sessionOrder(),done:[]};save()}return D.today}
const todayDone=()=>todayPlan().done;
function ring(n,N,size,label){const f=N?n/N:0,s=size,c=s/2,R=s*0.36,C=2*Math.PI*R,a=(-90+360*f)*Math.PI/180,w=Math.max(2,s/110);
 return `<div class="disc" style="width:${s}px;height:${s}px"><div class="disc-in"></div><svg viewBox="0 0 ${s} ${s}" width="${s}" height="${s}" role="img" aria-label="${n} exercices sur ${N}"><circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="var(--line)" stroke-width="${w}"/>${f>0?`<circle class="ringarc" cx="${c}" cy="${c}" r="${R}" fill="none" stroke="var(--ink)" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${(C*f).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${c} ${c})"/><circle class="ringdot" style="transform-origin:${c}px ${c}px;--from:${(-360*f).toFixed(1)}deg" cx="${(c+R*Math.cos(a)).toFixed(1)}" cy="${(c+R*Math.sin(a)).toFixed(1)}" r="${(s/56).toFixed(1)}" fill="var(--accent2)"/>`:""}<text x="${c}" y="${(c+s*0.065).toFixed(1)}" text-anchor="middle" font-size="${(s*0.2).toFixed(1)}" font-weight="200" fill="var(--ink)" letter-spacing="-2" font-family="Hanken Grotesk, system-ui, sans-serif"><tspan data-count="${n}">${n}</tspan><tspan fill="var(--muted)"> / ${N}</tspan></text>${label?`<text x="${c}" y="${(c+s*0.16).toFixed(1)}" text-anchor="middle" font-size="${(s*0.05).toFixed(1)}" fill="var(--muted)" font-family="Hanken Grotesk, system-ui, sans-serif">${label}</text>`:""}</svg></div>`}
function bilanDue(){const b=D.bilans||[];if(!b.length)return "first";const [y,m,d]=b[b.length-1].d.split("-").map(Number);return (Date.now()-new Date(y,m-1,d))/864e5>=28?"monthly":null}
function profileHTML(){
 const o=overall();const pl=GKEYS.filter(played);
 const best=pl.length>1?pl.reduce((a,b)=>idx(b)>idx(a)?b:a):null,weak=pl.length>1?pl.reduce((a,b)=>idx(b)<idx(a)?b:a):null;
 return `<section class="card stack" aria-labelledby="h-prof">
  <div class="profhead"><div><h2 class="h3" id="h-prof">Profil cognitif</h2><span class="small muted">Indice Hibi sur 100, d'après votre niveau</span></div>${o!==null?`<div class="bignum"><span class="num" data-count="${o}">${o}</span><small>${rating(o)}</small></div>`:""}</div>
  <div class="bars">${GKEYS.map(g=>{const p=played(g),v=idx(g);return `<div class="bar"><div class="bl"><span class="bn"><i style="background:${KCOL[g]}"></i>${GAMES[g].skill}</span><span class="num small">${p?`<b>${v}</b> · ${rating(v)}`:'<span class="muted">à évaluer</span>'}</span></div><div class="bt"><span style="width:${p?Math.max(3,v):0}%;background:${KCOL[g]}"></span></div></div>`}).join("")}</div>
  ${best&&best!==weak?`<p class="small"><b>Point fort :</b> ${GAMES[best].skill.toLowerCase()}. <b>À travailler :</b> ${GAMES[weak].skill.toLowerCase()}, placé juste après Champ visuel dans vos séances.</p>`:`<p class="small muted">Le profil se remplit au fil des exercices.</p>`}
 </section>`;
}
function startBilan(){session={order:GKEYS.slice(),i:0,results:[],bilan:true,before:Object.fromEntries(GKEYS.map(g=>[g,played(g)?idx(g):null]))};intro("ufov")}

/* ---------- home ---------- */
function home(){
 const P=todayPlan();const done=P.done.filter(g=>P.order.includes(g));const n=done.length,N=P.order.length,all=n>=N;
 const nextG=P.order.find(g=>!done.includes(g));
 const dateStr=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
 const hello=(new Date().getHours()<18?"Bonjour":"Bonsoir")+(D.name?" "+esc(D.name):"");
 const due=bilanDue();const wc=weekCount();
 show(`<div class="stack-lg">
  <header class="hhead"><div class="stack" style="gap:.25rem"><p class="eyebrow">${dateStr}</p><h1>${hello}</h1></div><span class="seal" aria-label="Hibi">日<br>々</span></header>
  <section class="hero" aria-labelledby="h-sess">
   <div class="herotop"><div class="ringwrap">${ring(n,N,280,"exercices aujourd'hui")}</div><div class="stack" style="gap:.25rem;min-width:0;text-align:center"><p class="eyebrow">Dix minutes, chaque jour</p><h2 id="h-sess">${all?"Séance faite. Bravo !":n?"On reprend où vous en étiez":"Prêt pour aujourd'hui ?"}</h2></div></div>
   <ol class="plan">${P.order.map((g,i)=>{const ok=done.includes(g);return `<li class="${ok?"ok":""}"><span class="pi" style="background:${KCOL[g]}"></span><span class="pt"><strong>${GAMES[g].name}</strong><span>${GAMES[g].skill}${i===0?" · cœur de la séance":""}</span></span>${ok?'<span class="pdone">fait</span>':""}</li>`}).join("")}</ol>
   <button class="btn" id="go">${all?"Refaire une séance":n?"Continuer : "+GAMES[nextG].name:"Commencer la séance"}</button>
   ${n&&!all?'<p class="small" style="opacity:.85">Faites une pause quand vous voulez : la séance reprend ici.</p>':""}
  </section>
  ${due?`<section class="card stack bilan" aria-labelledby="h-bil"><p class="eyebrow">${due==="first"?"Pour bien démarrer":"Bilan du mois"}</p><h2 class="h3" id="h-bil">${due==="first"?"Faites votre bilan de départ":"C'est l'heure de votre bilan mensuel"}</h2><p class="small muted">Les 4 exercices à la suite, environ 12 minutes. Il sert de repère pour mesurer vos progrès d'un mois sur l'autre.</p><button class="btn ghost" id="bil">Commencer le bilan</button></section>`:""}
  ${profileHTML()}
  <section class="card stack" aria-labelledby="h-week">
   ${programHead()}<div style="display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap"><h2 class="h3" id="h-week">Cette semaine</h2><span class="muted small num">${wc} jour${wc>1?"s":""} sur ${weekGoal()} visés</span></div>
   ${weekHTML()}
   <p class="small muted">Un jour manqué n'efface rien. Ce qui compte, c'est la régularité.</p>
  </section>
  <section class="stack" aria-labelledby="h-free"><h2 class="h3" id="h-free">Exercices à la carte</h2>

   shown=lv;trial(`Niveau ${lv} / 6`);msg(b===0?"Voici votre niveau de départ.":(lv>R[R.length-1].lv?"Bravo, on monte d'un cran.":"On redescend d'un cran pour consolider."));
   $("#stage").innerHTML=`<div class="bigcard"><span class="eyebrow">Niveau ${lv} sur 6</span><p>${cfg.desc}</p>${cfg.cue==="color"||cfg.cue==="flash"?LEGEND:""}</div>`;
   await ask([{v:1,label:"C'est parti",cls:"one"}]);if(!alive(id))return;
  }
  let bc=0;
  for(let t=0;t<PER;t++){
   if(!alive(id))return;const n=b*PER+t+1;trial(`Niveau ${lv} · ${n} / ${N}`);msg("");
   const keep=prev&&cfg.rules.includes(prev)&&Math.random()>cfg.p;
   const pool=prev?cfg.rules.filter(r=>r!==prev):cfg.rules;
   const rule=keep?prev:pool[Math.floor(Math.random()*pool.length)];
   const d=digits[Math.floor(Math.random()*8)];
   const l=Math.random()<.5?vow[Math.floor(Math.random()*5)]:con[Math.floor(Math.random()*8)];
   const Rl=RULES[rule];
   const cueTxt=cfg.cue==="text"?Rl.long:cfg.cue==="q"?Rl.q:Rl.sym;
   const stim=cfg.pair?`${l}${d}`:`${d}`;
   const leg=cfg.cue==="color"||cfg.cue==="flash"?LEGEND:"";
   const bar=cfg.dl?`<div class="timebar"><i style="animation-duration:${cfg.dl}ms"></i></div>`:`<div class="timebar off"></div>`;
   const colored=cfg.cue==="color"||cfg.cue==="flash";
   if(colored){
    trial(`Niveau ${lv} · ${n} / ${N} · affichage ${(vis/1000).toLocaleString("fr-FR",{maximumFractionDigits:1})} s`);
    $("#stage").innerHTML=`<div class="stack" style="gap:.6rem"><div class="bigcard rc ${rule}"><span class="rsym">${Rl.sym}</span><span class="digit num">${stim}</span></div>${bar}${leg}</div>`;
   }else{
    $("#stage").innerHTML=`<div class="stack" style="gap:.6rem"><div class="rule ${rule}">${cueTxt}</div><div class="bigcard"><span class="digit num">${stim}</span></div>${bar}${leg}</div>`;
   }
   const tk=++tok;
   if(colored)setTimeout(()=>{if(tk!==tok||!alive(id))return;const c=$(".rc");if(!c)return;c.querySelector(".digit").textContent="?";if(cfg.cue==="flash"){c.className="bigcard rc";c.querySelector(".rsym").textContent=""}},vis);
   const opts=cfg.cue==="text"?[{v:"oui",label:Rl.labels[0]},{v:"non",label:Rl.labels[1]}]:[{v:"oui",label:"Oui"},{v:"non",label:"Non"}];
   const t0=performance.now();
   const a=await askT(opts,cfg.dl);tok++;if(!alive(id))return;
   const rt=performance.now()-t0;
   const good=a!=="__late"&&((a==="oui")===Rl.ok(d,l));
   if(a==="__late")late++;
   if(good){bc++;pts+=lv}
   if(colored)vis=good?Math.max(300,Math.round(vis*.88)):Math.min(2200,Math.round(vis*1.15));
   R.push({rt,good,lv,sw:prev!==null&&rule!==prev,late:a==="__late"});
   await flash(good,a==="__late"?"Trop tard":good?"Juste":`Non : la règle était « ${Rl.long.toLowerCase()} »`);
   prev=rule;
  }
  const acc=bc/PER;
  if(!PR){if(acc>=.875&&lv<6)lv++;else if(acc<.625&&lv>1)lv--}
  top=Math.max(top,lv);
 }
 if(PR)return {practice:true};
 D.levels.switch=lv;if(top>=4)D.levels.swVis=vis;
 const correct=R.filter(r=>r.good).length;
 const sw=R.filter(r=>r.sw&&r.good).map(r=>r.rt),st=R.filter(r=>!r.sw&&r.good).map(r=>r.rt);
 const cost=sw.length&&st.length?Math.round(avg(sw)-avg(st)):null;
 return {score:pts,lines:[`Niveau : départ ${start}, plus haut atteint ${top}, prochaine fois ${lv} (sur 6)`,`${correct} bonnes réponses sur ${N}${late?`, dont ${late} réponse${late>1?"s":""} trop tardive${late>1?"s":""}`:""}`,"Chaque bonne réponse rapporte autant de points que le niveau où vous êtes.",...(top>=4?[`Temps d'affichage de la paire en fin d'exercice : ${(vis/1000).toLocaleString("fr-FR",{maximumFractionDigits:2})} s`]:[]),cost!==null?`Quand la règle change, vous mettez ${fmt(Math.max(0,cost))} ms de plus. Ce délai baisse avec l'entraînement.`:"Pas assez de changements de règle pour mesurer le temps de bascule."]};
};

 await ask([{v:1,label:"Je suis prêt",cls:"one"}]);if(!alive(id))return;
 const probes=shuffle(old.map(w=>({w,o:true})).concat(neu.map(w=>({w,o:false}))));

};

function chart(g){
 const col=KCOL[g];const pts=D.history.filter(h=>h.g===g).slice(-12);const G=GAMES[g];
 if(pts.length<2)return `<p class="small muted">${pts.length?"Encore une partie et la courbe apparaît.":"Pas encore de partie. La courbe apparaîtra après deux exercices."}</p>`;
 const W=320,H=120,pl=40,pr=12,pt=12,pb=22;const vals=pts.map(p=>p.s);
 let mn=Math.min(...vals),mx=Math.max(...vals);if(mn===mx){mn-=1;mx+=1}
 const inv=G.better==="lower";
 const y=v=>{const f=(v-mn)/(mx-mn);return pt+(inv?f:1-f)*(H-pt-pb)};
 const x=i=>pl+i*(W-pl-pr)/(pts.length-1);
 const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(p.s).toFixed(1)}`).join(" ");
 const area=line+` L${x(pts.length-1).toFixed(1)} ${H-pb} L${pl} ${H-pb} Z`;
 const best=inv?mn:mx,worst=inv?mx:mn;
 return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution ${G.name}, ${pts.length} dernières parties">
  <line x1="${pl}" x2="${W-pr}" y1="${pt}" y2="${pt}" stroke="var(--line)" stroke-dasharray="3 4"/>
  <line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>
  <text x="${pl-6}" y="${pt+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(Math.round(best))}</text>
  <text x="${pl-6}" y="${H-pb+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(Math.round(worst))}</text>
  <text x="${pl}" y="${H-5}" font-size="11" fill="var(--muted)">${pts.length} dernières parties</text>
  <path class="ar" d="${area}" fill="${col}" fill-opacity=".14"/>
  <path class="ln" pathLength="1" d="${line}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  ${pts.map((p,i)=>`<circle style="--k:${i}" cx="${x(i).toFixed(1)}" cy="${y(p.s).toFixed(1)}" r="${i===pts.length-1?5:2.5}" fill="${col}"/>`).join("")}
 </svg></div>`;
}

/* ---------- famille : synchronisation ---------- */
const VERSION="6.0";
const CFG=window.VIVACE_CONFIG||{};
const shareOn=()=>!!(CFG.supabaseUrl&&CFG.supabaseAnonKey);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==="x"?r:(r&3|8)).toString(16)}));
async function rpc(fn,args){
 if(!shareOn())throw new Error("noconfig");
 let r;
 try{r=await fetch(CFG.supabaseUrl.replace(/\/$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"Content-Type":"application/json",apikey:CFG.supabaseAnonKey,Authorization:"Bearer "+CFG.supabaseAnonKey},body:JSON.stringify(args)})}catch(e){throw new Error("offline")}
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok)throw new Error((j&&j.message)||"server");
 return j;
}
function errText(e){const m=e&&e.message||"";
 if(m==="offline")return "Pas de connexion internet. Réessayez quand vous êtes connecté.";
 if(m==="noconfig")return "Le partage n'est pas encore activé sur cette installation.";
 if(/sauvegarde introuvable/i.test(m))return "Aucune sauvegarde ne correspond à ce code. Vérifiez les 12 caractères.";
 if(/introuvable/i.test(m))return "Ce code de groupe n'existe pas. Vérifiez les 8 caractères.";
 if(/prenom/i.test(m))return "Indiquez un prénom de 1 à 40 caractères.";
 if(/could not find the function|schema cache/i.test(m))return "La sauvegarde n'est pas encore activée sur le serveur.";
 return "Le serveur n'a pas répondu correctement. Réessayez dans un instant.";
}
function queue(g,s,d){if(!D.family)return;D.pending.push({g,s,d});save();flush()}
let flushing=false;
async function flush(){
 if(flushing||!D.family||!shareOn()||!D.pending.length)return;flushing=true;
 try{while(D.pending.length&&D.family){const p=D.pending[0];await rpc("vivace_add",{p_code:D.family.code,p_member:D.family.memberId,p_game:p.g,p_score:p.s,p_day:p.d});D.pending.shift();save()}}catch(e){}
 flushing=false;
}
window.addEventListener("online",flush);

/* ---------- famille : écrans ---------- */
let famTab=null;
function famille(){
 if(!shareOn())return show(`<div class="stack-lg">
  <header class="stack" style="gap:.35rem"><p class="eyebrow">Entre proches</p><h1>Famille</h1></header>
  <div class="card stack"><h2 class="h3">Le partage n'est pas encore activé</h2><p>Cette installation de Hibi n'est reliée à aucune base de données. Les exercices fonctionnent normalement, mais les résultats restent sur cet appareil.</p><p class="small muted">Pour l'activer, renseignez l'adresse et la clé Supabase dans le fichier config.js du dépôt (voir le README).</p></div>
 </div>`,"famille");
 if(!D.family)return joinView();
 return familyView();
}
function joinView(){
 const inv=(new URLSearchParams(location.search).get("famille")||"").toUpperCase();
 if(famTab===null)famTab=inv?"join":"create";
 const j=famTab==="join";
 show(`<div class="stack-lg">
  <header class="stack" style="gap:.35rem"><p class="eyebrow">Entre proches</p><h1>Famille</h1><p class="muted">Créez un groupe, invitez vos proches avec un code, et suivez ensemble la régularité et les progrès de chacun.</p></header>
  <div class="tabs2" role="group"><button id="t-create" aria-pressed="${!j}">Créer un groupe</button><button id="t-join" aria-pressed="${j}">J'ai un code</button></div>
  <form class="card stack" id="ff" novalidate>
   <label class="f" for="f-name">Votre prénom<input class="t" id="f-name" autocomplete="given-name" maxlength="40" placeholder="Ex. Pascal" value="${esc(D.lastName||D.name||"")}"></label>
   ${j?`<label class="f" for="f-code">Code du groupe<input class="t code" id="f-code" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="8 caractères" value="${esc(inv)}"></label>`
      :`<label class="f" for="f-group">Nom du groupe<input class="t" id="f-group" maxlength="40" placeholder="Ex. Famille Tea"></label>`}
   <p class="err" id="ferr" hidden></p>
   <button class="btn" type="submit" id="fgo">${j?"Rejoindre le groupe":"Créer le groupe"}</button>
   <p class="small muted">Vos résultats passés seront ajoutés au groupe. Pas d'e-mail ni de mot de passe : le code du groupe sert de clé, partagez-le seulement avec vos proches.</p>
  </form>
 </div>`,"famille");
 $("#t-create").onclick=()=>{famTab="create";joinView()};
 $("#t-join").onclick=()=>{famTab="join";joinView()};
 $("#ff").onsubmit=async ev=>{ev.preventDefault();
  const name=$("#f-name").value.trim();const err=$("#ferr");err.hidden=true;
  if(!name){err.hidden=false;err.textContent="Indiquez votre prénom.";return}
  const btn=$("#fgo");btn.disabled=true;btn.textContent="Un instant…";
  try{
   const memberId=uid();let code,gname;
   if(j){code=$("#f-code").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");if(code.length!==8)throw new Error("introuvable");gname=await rpc("vivace_join",{p_code:code,p_member:memberId,p_name:name})}
   else{gname=$("#f-group").value.trim()||("Famille de "+name);code=await rpc("vivace_create_family",{p_name:gname});await rpc("vivace_join",{p_code:code,p_member:memberId,p_name:name})}
   D.family={code,name:gname,memberId,memberName:name};D.lastName=name;
   D.pending=D.history.map(h=>({g:h.g,s:h.s,d:h.d})).concat(D.pending);save();
   if(inv)history.replaceState(null,"",location.pathname);
   await flush();familyView(true);
  }catch(e){err.hidden=false;err.textContent=errText(e);btn.disabled=false;btn.textContent=j?"Rejoindre le groupe":"Créer le groupe"}
 };
}
function inviteLink(){return location.origin+location.pathname+"?famille="+D.family.code}
async function invite(){
 const url=inviteLink(),text=`Rejoins notre groupe « ${D.family.name} » sur Hibi, 10 minutes par jour pour garder l'esprit vif. Code du groupe : ${D.family.code}`;
 const out=$("#invout");
 if(navigator.share){try{await navigator.share({title:"Hibi",text,url});return}catch(e){if(e&&e.name==="AbortError")return}}
 try{await navigator.clipboard.writeText(text+"\n"+url);out.hidden=false;out.textContent="Invitation copiée. Collez-la dans un message à vos proches."}catch(e){out.hidden=false;out.textContent="Envoyez ce lien à vos proches : "+url}
}
const SERIES=["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)","var(--s6)"];
async function familyView(fresh){
 const F=D.family;
 show(`<div class="stack-lg">
  <header class="stack" style="gap:.35rem"><p class="eyebrow">Groupe famille</p><h1>${esc(F.name)}</h1></header>
  <section class="stack" style="gap:.6rem">
   <div class="codebox"><span><span class="small muted">Code du groupe</span><br><b>${F.code}</b></span><button class="btn" id="inv" style="width:auto;padding-inline:1.2rem">Inviter mes proches</button></div>
   <p class="small muted" id="invout" hidden></p>
  </section>
  <div id="famdata" class="stack-lg"><div class="card"><p class="muted">Chargement des résultats du groupe…</p></div></div>
 </div>`,"famille");
 $("#inv").onclick=invite;
 await flush();
 let rows;
 try{rows=await rpc("vivace_family",{p_code:F.code,p_member:F.memberId})}
 catch(e){const box=$("#famdata");if(!box)return;box.innerHTML=`<div class="card stack"><p class="err">${errText(e)}</p><button class="btn quiet" id="retry">Réessayer</button></div>`;$("#retry").onclick=()=>familyView();return}
 const box=$("#famdata");if(!box)return;
 const by={};(rows||[]).forEach(r=>{if(!by[r.mkey])by[r.mkey]={key:r.mkey,name:r.name,me:r.is_me,res:[]};if(r.game)by[r.mkey].res.push({g:r.game,s:r.score,d:r.day})});
 const mem=Object.values(by).sort((a,b)=>(b.me-a.me)||a.name.localeCompare(b.name,"fr"));
 mem.forEach((m,i)=>m.color=SERIES[i%SERIES.length]);
 const wk=weekDays().map(dkey);
 const memRows=mem.map(m=>{const days=new Set(m.res.map(r=>r.d));const n=wk.filter(k=>days.has(k)).length;const last=m.res.length?m.res.map(r=>r.d).sort().pop():null;
  return `<div class="mem"><span class="nm"><i style="background:${m.color}"></i><span style="min-width:0;overflow-wrap:anywhere">${esc(m.name)}</span>${m.me?'<span class="you">vous</span>':""}</span><span class="num small"><b>${n}</b> / 5 jours</span><div class="wk" aria-label="${n} jours actifs cette semaine">${wk.map(k=>`<span class="${days.has(k)?"on":""}"></span>`).join("")}</div><span class="small muted" style="grid-column:1/-1">${last?"Dernière séance : "+fmtDay(last):"Pas encore de séance"}</span></div>`}).join("");
 const total=mem.reduce((s,m)=>s+wk.filter(k=>m.res.some(r=>r.d===k)).length,0),goal=mem.length*5;
 box.innerHTML=`
  <section class="card stack"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;flex-wrap:wrap"><h2 class="h3">Cette semaine</h2><span class="small muted num">${total} jours actifs sur ${goal} visés à ${mem.length}</span></div>
   <div>${memRows||'<p class="muted">Personne pour l\'instant.</p>'}</div>
   ${mem.length<2?'<p class="small muted">Invitez un proche pour commencer à vous suivre mutuellement.</p>':""}</section>
  ${Object.keys(GAMES).map(g=>`<section class="card stack" style="gap:.6rem"><div><h2 class="h3">${GAMES[g].name}</h2><span class="small muted">${GAMES[g].skill} · ${GAMES[g].better==="lower"?"en "+GAMES[g].unit+", plus haut sur la courbe = plus rapide":GAMES[g].unit+", plus haut = mieux"}</span></div>${multiChart(g,mem)}</section>`).join("")}
  <p class="small muted">Chacun progresse à partir de son propre niveau. Comparez surtout la pente des courbes, pas leur hauteur.</p>
  <button class="btn quiet" id="refresh">Actualiser</button>`;
 $("#refresh").onclick=()=>familyView();
}
function fmtDay(k){const t=today();if(k===t)return "aujourd'hui";const y=dkey(new Date(Date.now()-864e5));if(k===y)return "hier";const [a,b,c]=k.split("-").map(Number);return new Date(a,b-1,c).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}
function multiChart(g,mem){
 const S=mem.map(m=>({name:m.name,color:m.color,pts:m.res.filter(r=>r.g===g).sort((a,b)=>a.d<b.d?-1:1).slice(-10).map(r=>r.s)})).filter(s=>s.pts.length);
 if(!S.length)return '<p class="small muted">Personne n\'a encore joué à cet exercice.</p>';
 const W=320,H=130,pl=40,pr=12,pt=12,pb=22;const all=S.flatMap(s=>s.pts);
 let mn=Math.min(...all),mx=Math.max(...all);if(mn===mx){mn-=1;mx+=1}
 const inv=GAMES[g].better==="lower";const len=Math.max(...S.map(s=>s.pts.length));
 const y=v=>{const f=(v-mn)/(mx-mn);return pt+(inv?f:1-f)*(H-pt-pb)};
 const x=i=>len===1?(pl+W-pr)/2:pl+i*(W-pl-pr)/(len-1);
 const best=inv?mn:mx,worst=inv?mx:mn;
 const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${GAMES[g].name}, dernières parties de chaque membre">
  <line x1="${pl}" x2="${W-pr}" y1="${pt}" y2="${pt}" stroke="var(--line)" stroke-dasharray="3 4"/>
  <line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>
  <text x="${pl-6}" y="${pt+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(Math.round(best))}</text>
  <text x="${pl-6}" y="${H-pb+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(Math.round(worst))}</text>
  <text x="${pl}" y="${H-5}" font-size="11" fill="var(--muted)">Parties successives, 10 au maximum</text>
  ${S.map(s=>`${s.pts.length>1?`<path class="ln" pathLength="1" d="${s.pts.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:""}<circle cx="${x(s.pts.length-1).toFixed(1)}" cy="${y(s.pts[s.pts.length-1]).toFixed(1)}" r="4" fill="${s.color}"/>`).join("")}
 </svg>`;
 return `<div class="chart">${svg}</div><div class="legend2">${S.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)} <span class="muted num">${fmt(s.pts[s.pts.length-1])}</span></span>`).join("")}</div>`;
}


/* ---------- programme : fondation 8 semaines, entretien, rappels ---------- */
const BOOST_WEEKS=[13,27,53];
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function parseDay(k){const [a,b,c]=k.split("-").map(Number);return new Date(a,b-1,c)}
function programStart(){
 if(D.program&&D.program.start)return parseDay(D.program.start);
 const ds=Object.keys(D.days).sort();if(!ds.length)return null;
 D.program={start:dkey(mondayOf(parseDay(ds[0])))};save();return parseDay(D.program.start);
}
function programWeek(){const s=programStart();if(!s)return 0;return Math.floor((mondayOf(new Date())-s)/(7*864e5))+1}
function phaseOf(w){if(w<=0)return "avant";if(w<=8)return "fondation";if(BOOST_WEEKS.includes(w)||(w>53&&(w-53)%26===0))return "rappel";return "entretien"}
function weekGoal(){const ph=phaseOf(programWeek());return ph==="entretien"?2:5}
function foundationDone(){const s=programStart();if(!s)return 0;const end=new Date(s);end.setDate(end.getDate()+56);return Object.keys(D.days).filter(k=>{const d=parseDay(k);return d>=s&&d<end}).length}
function nextBoost(w){const all=BOOST_WEEKS.concat([79,105,131]);return all.find(x=>x>w)}
function weekDate(w){const s=programStart();const d=new Date(s);d.setDate(d.getDate()+(w-1)*7);return d}
const fmtShort=d=>d.toLocaleDateString("fr-FR",{day:"numeric",month:"long"});
function programHead(){
 const w=programWeek(),ph=phaseOf(w);
 if(ph==="avant")return `<p class="small muted">Votre programme de 8 semaines démarre avec votre première séance.</p>`;
 if(ph==="fondation"){const n=foundationDone();return `<div class="stack" style="gap:.4rem"><div class="bl"><span class="eyebrow">Programme · fondation, semaine ${w} sur 8</span><span class="num small muted">${n} / 40 séances</span></div><div class="bt"><span style="width:${Math.max(2,Math.min(100,n/40*100))}%;background:var(--ink)"></span></div></div>`}
 if(ph==="rappel")return `<div class="stack" style="gap:.2rem"><span class="eyebrow">Programme · semaine de rappel</span><p class="small">Cinq séances cette semaine pour ancrer vos acquis, comme les séances de rappel de l'étude ACTIVE.</p></div>`;
 const nb=nextBoost(w);return `<div class="stack" style="gap:.2rem"><span class="eyebrow">Programme · entretien</span><p class="small muted">Deux séances par semaine suffisent. Prochaine semaine de rappel : semaine du ${fmtShort(weekDate(nb))}.</p></div>`;
}
function programCard(){
 const s=programStart();
 if(!s)return `<section class="card stack"><h2 class="h3">Votre programme</h2><p class="small muted">Il démarre avec votre première séance : 8 semaines de fondation, puis un entretien léger et des semaines de rappel.</p></section>`;
 const w=programWeek(),ph=phaseOf(w),n=foundationDone();
 const end=weekDate(9);end.setDate(end.getDate()-1);
 const rows=[
  {t:"Fondation",d:`5 séances par semaine, du ${fmtShort(s)} au ${fmtShort(end)}`,st:w>8?"fait":ph==="fondation"?"en cours":""},
  {t:"Entretien",d:"2 séances par semaine",st:ph==="entretien"?"en cours":w>8?"":""}]
  .concat(BOOST_WEEKS.map((b,i)=>({t:`Rappel ${["du 3ᵉ mois","du 6ᵉ mois","du 12ᵉ mois"][i]}`,d:`5 séances la semaine du ${fmtShort(weekDate(b))}`,st:w>b?"fait":w===b?"en cours":""})));
 return `<section class="card stack" style="gap:.6rem"><div class="profhead"><div><h2 class="h3">Votre programme</h2><span class="small muted">Inspiré de l'étude ACTIVE : un entraînement régulier, puis des séances de rappel.</span></div>${ph==="fondation"?`<div class="bignum"><span class="num">${n}</span><small>sur 40</small></div>`:""}</div>
  <div class="rows">${rows.map(r=>`<div class="row" style="min-height:3.2rem"><span class="t"><b>${r.t}</b><span>${r.d}</span></span><span class="small ${r.st==="en cours"?"st-on":"muted"}">${r.st}</span></div>`).join("")}</div></section>`;
}
function programIcs(time){
 const [hh,mm]=time.split(":").map(Number);const z=n=>String(n).padStart(2,"0");
 const dt=d=>`${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}T${z(hh)}${z(mm)}00`;
 const dd=d=>`${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}T235900`;
 const now=new Date();const stamp=`${now.getUTCFullYear()}${z(now.getUTCMonth()+1)}${z(now.getUTCDate())}T${z(now.getUTCHours())}${z(now.getUTCMinutes())}${z(now.getUTCSeconds())}Z`;
 const url=location.origin+location.pathname;
 let s=programStart()||mondayOf(new Date());
 const tomorrow=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
 const fEnd=new Date(s);fEnd.setDate(fEnd.getDate()+55);
 const ev=(uid,start,rrule,sum,desc)=>["BEGIN:VEVENT",`UID:${uid}-${Date.now()}@hibi`,`DTSTAMP:${stamp}`,`DTSTART:${dt(start)}`,"DURATION:PT10M",`RRULE:${rrule}`,`SUMMARY:${sum}`,`DESCRIPTION:${desc} ${url}`,`URL:${url}`,"BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${sum}`,"TRIGGER:PT0M","END:VALARM","END:VEVENT"];
 let L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Hibi//FR","CALSCALE:GREGORIAN"];
 const fStart=tomorrow>s?tomorrow:s;
 if(fStart<=fEnd)L=L.concat(ev("fondation",fStart,`FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR;UNTIL=${dd(fEnd)}`,"Hibi : séance du jour","Fondation, 10 minutes."));
 const eStart=new Date(fEnd);eStart.setDate(eStart.getDate()+2);
 L=L.concat(ev("entretien",eStart>tomorrow?eStart:tomorrow,"FREQ=WEEKLY;BYDAY=TU,SA","Hibi : séance d'entretien","Deux séances par semaine."));
 BOOST_WEEKS.forEach((b,i)=>{const d=new Date(s);d.setDate(d.getDate()+(b-1)*7);if(d>now)L=L.concat(ev("rappel"+b,d,"FREQ=DAILY;COUNT=5","Hibi : semaine de rappel","Cinq séances cette semaine pour ancrer vos acquis."))});
 L.push("END:VCALENDAR");return L.join("\r\n");
}

/* ---------- compte : connexion par code reçu par e-mail, synchronisation entre appareils ---------- */
const AKEY="hibi-auth";
var AUTH=(()=>{try{return JSON.parse(localStorage.getItem(AKEY)||"null")}catch(e){return null}})();
function signedIn(){return !!(AUTH&&AUTH.refresh_token)}
function saveAuth(a){AUTH=a;try{a?localStorage.setItem(AKEY,JSON.stringify(a)):localStorage.removeItem(AKEY)}catch(e){}}
const sbUrl=p=>CFG.supabaseUrl.replace(/\/$/,"")+p;
async function gotrue(path,body,token){
 let r;try{r=await fetch(sbUrl("/auth/v1/"+path),{method:"POST",headers:{"Content-Type":"application/json",apikey:CFG.supabaseAnonKey,Authorization:"Bearer "+(token||CFG.supabaseAnonKey)},body:JSON.stringify(body||{})})}catch(e){throw new Error("offline")}
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok){const e=new Error((j&&(j.msg||j.error_description||j.message||j.error))||"server");e.status=r.status;e.code=j&&(j.error_code||j.code);throw e}
 return j;
}
function keepSession(j){saveAuth({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+((j.expires_in||3600)-60)*1000,email:(j.user&&j.user.email)||(AUTH&&AUTH.email)||"",user_id:(j.user&&j.user.id)||(AUTH&&AUTH.user_id)})}
var refreshing=null;
async function accessToken(){
 if(!signedIn())throw new Error("signedout");
 if(Date.now()<AUTH.expires_at)return AUTH.access_token;
 if(!refreshing)refreshing=gotrue("token?grant_type=refresh_token",{refresh_token:AUTH.refresh_token}).then(keepSession)
  .catch(e=>{if(e.status===400||e.status===401||e.status===403){saveAuth(null);throw new Error("signedout")}throw e}).finally(()=>{refreshing=null});
 await refreshing;return AUTH.access_token;
}
async function rest(path,opts){
 const tok=await accessToken();let r;
 try{r=await fetch(sbUrl("/rest/v1/"+path),Object.assign({},opts,{headers:Object.assign({"Content-Type":"application/json",apikey:CFG.supabaseAnonKey,Authorization:"Bearer "+tok},(opts&&opts.headers)||{})}))}catch(e){throw new Error("offline")}
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok)throw new Error((j&&j.message)||"server");
 return j;
}
function authErr(e){const m=(e&&e.message)||"",s=e&&e.status,c=(e&&e.code)||"";
 if(m==="offline")return "Pas de connexion internet. Réessayez quand vous êtes connecté.";
 if(s===429||/rate/i.test(c+m))return "Trop de demandes d'affilée. Patientez une minute avant de redemander un code.";
 if(/otp_expired|expired|invalid/i.test(c+m)&&s>=400&&s<500)return "Ce code n'est pas bon ou a expiré. Vérifiez les chiffres, ou demandez un nouveau code.";
 if(/email/i.test(c+m)&&s===400)return "Cette adresse e-mail ne semble pas valide.";
 if(/signup.*disabled|not allowed/i.test(c+m))return "La création de compte n'est pas encore activée sur le serveur.";
 if(/relation|user_data|schema cache|could not find/i.test(m))return "Les comptes ne sont pas encore activés sur le serveur.";
 return "Le serveur n'a pas répondu correctement. Réessayez dans un instant.";
}

// Fusion : rien ne se perd entre deux appareils. Les listes s'additionnent (sans doublon),
// les réglages d'exercice suivent l'appareil utilisé le plus récemment.
function syncPayload(){return {v:2,updated:D.updated||0,resetAt:D.resetAt||0,levels:D.levels,history:D.history,days:D.days,bilans:D.bilans,name:D.name,practiced:D.practiced||{},program:D.program||null,family:D.family||null,remTime:D.remTime||null,today:D.today||null,onboarded:!!D.onboarded}}
function mergeData(L,R){
 if(!R)return L;
 const cut=Math.max(L.resetAt||0,R.resetAt||0),cutDay=cut?dkey(new Date(cut)):"";
 const hk=h=>h.t?"t"+h.t+h.g:[h.g,h.d,h.s].join("|");
 const count=(arr)=>{const m=new Map();(arr||[]).forEach(h=>{const k=hk(h);m.set(k,(m.get(k)||[]).concat([h]))});return m};
 const A=count(L.history),B=count(R.history),hist=[];
 new Set([...A.keys(),...B.keys()]).forEach(k=>{const a=A.get(k)||[],b=B.get(k)||[];hist.push(...(a.length>=b.length?a:b))});
 const history=hist.filter(h=>!cut||(h.t?h.t>=cut:h.d>cutDay)).sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:(x.t||0)-(y.t||0));
 const days={};[L.days,R.days].forEach(o=>Object.keys(o||{}).forEach(k=>{if(!cut||k>=cutDay)days[k]=1}));
 const bil={};[...(L.bilans||[]),...(R.bilans||[])].forEach(b=>{if(!cut||b.d>=cutDay)bil[b.d]=b});
 const hasL=(L.history||[]).length>0,hasR=(R.history||[]).length>0;
 const newer=hasR&&!hasL?R:hasL&&!hasR?L:((R.updated||0)>(L.updated||0)?R:L); // un appareil neuf ne prend pas le pas sur le compte
 const pr=Object.assign({},R.practiced||{},L.practiced||{});
 const ps=[L.program,R.program].filter(p=>p&&p.start).sort((a,b)=>a.start<b.start?-1:1)[0]||null;
 let today=newer.today||null;const lt=L.today,rt=R.today;
 if(lt&&rt&&lt.d===rt.d)today=Object.assign({},newer.today,{done:[...new Set([...(lt.done||[]),...(rt.done||[])])]});
 else if(lt&&rt)today=lt.d>rt.d?lt:rt;
 return Object.assign({},L,{levels:newer.levels||L.levels,name:newer.name||L.name||R.name||"",family:newer.family!==undefined?newer.family:L.family,remTime:newer.remTime||L.remTime||null,
  history,days,bilans:Object.values(bil).sort((a,b)=>a.d<b.d?-1:1),practiced:pr,program:ps,today,onboarded:!!(L.onboarded||R.onboarded),resetAt:cut,updated:Math.max(L.updated||0,R.updated||0)});
}
