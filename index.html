<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hibi</title>
<meta name="description" content="日々, jour après jour. Dix minutes par jour pour garder l'esprit vif après 40 ans.">
<meta name="theme-color" content="#F4F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hibi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500;600;700&display=swap">
<style>
/* Layout: one calm column (max 34rem), fixed bottom tab bar, large tap targets; games take the full column with nav hidden */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --tint:#E1EBE6; --line:#CFDAD4;
  --ink:#142824; --muted:#53645D;
  --accent:#1C6E5A; --accent-ink:#FFFFFF; --warm:#B26C17;
  --good:#2E7D4F; --bad:#B3412E;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1715; --surface:#17221F; --tint:#1C2B27; --line:#2B3B35;
  --ink:#E5EEEA; --muted:#9DADA6;
  --accent:#62C4A4; --accent-ink:#0B1915; --warm:#E3A75C;
  --good:#71CF98; --bad:#EF8C78; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1715; --surface:#17221F; --tint:#1C2B27; --line:#2B3B35;
  --ink:#E5EEEA; --muted:#9DADA6;
  --accent:#62C4A4; --accent-ink:#0B1915; --warm:#E3A75C;
  --good:#71CF98; --bad:#EF8C78; color-scheme:dark }

html{font-size:18px}
html[data-size="normal"]{font-size:16px}
html[data-size="grand"]{font-size:18px}
html[data-size="tresgrand"]{font-size:21px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
*{box-sizing:border-box}
.wrap{max-width:34rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(1.25rem + env(safe-area-inset-top,0px)) calc(7rem + env(safe-area-inset-bottom,0px))}
body.playing .wrap{padding-bottom:calc(2rem + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2.1rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.55rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:1rem}
.stack-lg{display:flex;flex-direction:column;gap:1.75rem}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.num{font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.25rem}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:22px;padding:1.4rem 1.3rem;display:flex;flex-direction:column;gap:1rem}
.hero .eyebrow{color:inherit;opacity:.8}
.hero ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.55rem}
.hero li{display:flex;align-items:baseline;gap:.75rem}
.hero li b{font-family:var(--display);font-size:.95rem;min-width:1.3rem;opacity:.75}
.hero li span.sk{opacity:.78;font-size:.88rem}
.core{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:99px;padding:.05rem .45rem;margin-left:.35rem;opacity:.9}

button{font:inherit;color:inherit;cursor:pointer}
.btn{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;min-height:3.4rem;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.05rem;padding:.6rem 1rem}
.hero .btn{background:var(--accent-ink);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn.quiet{background:var(--tint);color:var(--ink)}
.btn.danger{background:var(--bad);color:var(--surface)}
button:focus-visible{outline:3px solid var(--warm);outline-offset:3px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:.5rem 0;min-height:2.75rem}

.week{display:flex;justify-content:space-between;gap:.4rem}
.day{display:flex;flex-direction:column;align-items:center;gap:.3rem;flex:1}
.day i{width:2.1rem;height:2.1rem;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal}
.day.on i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day.today i{border-color:var(--accent)}
.day small{font-size:.75rem;color:var(--muted);font-weight:700}

.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:1rem;padding:.9rem 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;min-height:4rem}
.row:first-child{border-top:0}
.row .ic{width:2.75rem;height:2.75rem;border-radius:12px;background:var(--tint);display:grid;place-items:center;flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block}
.row .t span{color:var(--muted);font-size:.88rem}
.row .chev{color:var(--muted)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));z-index:5}
nav.tabs .in{max-width:34rem;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.55rem 0 .6rem;min-height:3.6rem;color:var(--muted);font-size:.72rem;font-weight:700;min-width:0}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs svg{width:1.45rem;height:1.45rem}
body.playing nav.tabs{display:none}

/* game */
.gtop{display:flex;justify-content:space-between;align-items:center;min-height:2.75rem}
.gtop span{color:var(--muted);font-weight:700;font-size:.9rem}
#msg{font-size:1.1rem;min-height:3.3rem}
#stage{transition:box-shadow .2s}
#stage.ok{box-shadow:0 0 0 4px var(--good);border-radius:22px}
#stage.bad{box-shadow:0 0 0 4px var(--bad);border-radius:22px}
#controls{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;min-height:4.2rem}
#controls .one{grid-column:1/-1}
.choice{min-height:4.2rem;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:1.1rem;display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.5rem}
.choice:active{background:var(--tint)}
#fb{min-height:1.6rem;text-align:center;font-weight:700}
#fb.ok{color:var(--good)} #fb.bad{color:var(--bad)}

.ufov{position:relative;width:100%;max-width:22rem;aspect-ratio:1;margin:0 auto;border-radius:50%;background:var(--tint);border:1px solid var(--line);overflow:hidden}
.slot{position:absolute;transform:translate(-50%,-50%);width:15%;aspect-ratio:1;display:grid;place-items:center}
.slot svg{width:100%;height:100%}
.slot button{width:100%;height:100%;border-radius:50%;border:2.5px dashed var(--accent);background:var(--surface)}
.cross{font-family:var(--display);font-size:2rem;color:var(--muted)}
.maskch{position:absolute;transform:translate(-50%,-50%);color:var(--muted);font-size:1.4rem;line-height:1}

.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;max-width:21rem;margin:0 auto;padding:.7rem;background:var(--tint);border-radius:22px}
.tile{aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:var(--surface);transition:background .12s}
.tile.lit{background:var(--warm);border-color:var(--warm)}
.tile.tap{background:var(--accent);border-color:var(--accent)}
.tile.wrong{background:var(--bad);border-color:var(--bad)}
.tile:disabled{cursor:default}

.rule{border-radius:14px;padding:.7rem 1rem;text-align:center;font-weight:700;font-size:1.05rem;letter-spacing:.03em}
.rule.par{background:var(--accent);color:var(--accent-ink)}
.rule.mag{background:var(--warm);color:var(--surface)}
.bigcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;display:grid;place-items:center;min-height:12rem;gap:.5rem;padding:1rem;text-align:center}
.rc{position:relative;transition:background .15s}
.rc.par,.lg.par{background:var(--accent);color:var(--accent-ink)}
.rc.mag,.lg.mag{background:var(--warm);color:var(--surface)}
.rc.let,.lg.let{background:var(--ink);color:var(--bg)}
.rc.par,.rc.mag,.rc.let{border-color:transparent}
.rsym{position:absolute;top:.7rem;left:.9rem;font-size:1.2rem}
.rule.let{background:var(--ink);color:var(--bg)}
.timebar{height:6px;background:var(--tint);border-radius:3px;overflow:hidden}
.timebar.off{visibility:hidden}
.timebar i{display:block;height:100%;width:100%;background:var(--warm);animation:drain linear forwards}
@keyframes drain{from{width:100%}to{width:0}}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem 1rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.lg{display:inline-grid;place-items:center;width:1.5rem;height:1.5rem;border-radius:6px;font-size:.8rem}
.digit{font-family:var(--display);font-size:5.5rem;font-weight:800;line-height:1}
.word{font-family:var(--display);font-size:2.2rem;font-weight:700;line-height:1.15}

.big{font-family:var(--display);font-size:3.4rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.unit{font-size:1.1rem;color:var(--muted);font-weight:700;margin-left:.35rem;font-family:var(--body)}
.delta{border-radius:12px;padding:.7rem .9rem;background:var(--tint)}
ul.plain{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:.35rem}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:.4rem;background:var(--tint);padding:.3rem;border-radius:14px}
.seg button{border:0;background:none;border-radius:10px;min-height:2.9rem;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.chart svg{width:100%;height:auto;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:.35rem}
.cal i{aspect-ratio:1;border-radius:6px;background:var(--tint)}
.cal i.on{background:var(--accent)}
.cal i.fut{background:transparent;border:1px dashed var(--line)}

.pairs{display:flex;flex-direction:column}
.pair{padding:.85rem 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:.25rem}
.pair:first-child{border-top:0;padding-top:0}
.pair .q{color:var(--muted);font-size:.92rem}
.pair .a{font-weight:700}
.note{border-left:3px solid var(--warm);padding-left:.85rem}
a{color:var(--accent)}
.steps{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.5rem}
.illu{display:grid;place-items:center;background:var(--tint);border-radius:16px;padding:1rem}
.illu svg{width:100%;max-width:15rem;height:auto}
.confirm{display:flex;flex-direction:column;gap:.6rem}
/* famille */
:root{--s1:var(--accent);--s2:var(--warm);--s3:#3E6CB0;--s4:#8A57B0;--s5:#B0436A;--s6:#5E7A2E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s3:#8DB2EC;--s4:#C9A2E8;--s5:#EE94B3;--s6:#B5D17A}}
:root[data-theme="dark"]{--s3:#8DB2EC;--s4:#C9A2E8;--s5:#EE94B3;--s6:#B5D17A}
label.f{display:flex;flex-direction:column;gap:.35rem;font-weight:700}
input.t{font:inherit;font-weight:400;min-height:3.2rem;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:.5rem .85rem;width:100%}
input.t:focus{outline:3px solid var(--warm);outline-offset:2px}
input.code{text-transform:uppercase;letter-spacing:.18em;font-variant-numeric:tabular-nums;font-weight:700}
.err{color:var(--bad);font-weight:700}
.codebox{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;background:var(--tint);border-radius:14px;padding:.8rem 1rem}
.codebox b{font-size:1.35rem;letter-spacing:.16em;font-variant-numeric:tabular-nums;user-select:all}
.mem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.45rem 1rem;align-items:center;padding:.8rem 0;border-top:1px solid var(--line)}
.mem:first-child{border-top:0;padding-top:0}
.mem .nm{display:flex;align-items:center;gap:.5rem;font-weight:700;min-width:0}
.mem .nm i{width:.8rem;height:.8rem;border-radius:50%;flex:none}
.mem .wk{grid-column:1/-1;display:flex;gap:.3rem}
.mem .wk span{flex:1;height:.55rem;border-radius:4px;background:var(--tint)}
.mem .wk span.on{background:var(--accent)}
.you{font-size:.72rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:0 .4rem}
.legend2{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-size:.85rem}
.legend2 span{display:inline-flex;align-items:center;gap:.35rem}
.legend2 i{width:.75rem;height:.75rem;border-radius:50%}
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;background:var(--tint);padding:.3rem;border-radius:14px}
.tabs2 button{border:0;background:none;border-radius:10px;min-height:2.9rem;font-weight:700;color:var(--muted)}
.tabs2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
/* v2 : un code couleur par capacité (couleur + icône + libellé), anneau de séance, profil cognitif */
:root{--k-ufov:#D2691E;--k-corsi:#6A4FC0;--k-switch:#17807F;--k-list:#BE3C67;--k-ink:#FFFFFF;--up:#2E7D4F;--down:#B3412E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--k-ufov:#F0A15B;--k-corsi:#B29CF2;--k-switch:#69CFCB;--k-list:#F08CAE;--k-ink:#0F1715;--up:#71CF98;--down:#EF8C78}}
:root[data-theme="dark"]{--k-ufov:#F0A15B;--k-corsi:#B29CF2;--k-switch:#69CFCB;--k-list:#F08CAE;--k-ink:#0F1715;--up:#71CF98;--down:#EF8C78}
.up{color:var(--up)} .down{color:var(--down)}
.pi{width:2.6rem;height:2.6rem;border-radius:12px;display:inline-grid;place-items:center;color:var(--k-ink);flex:none}
.pi svg{width:1.35rem;height:1.35rem}
.pi.lg{width:3.4rem;height:3.4rem;border-radius:16px}
.pi.lg svg{width:1.75rem;height:1.75rem}
.gname{display:flex;align-items:center;gap:.9rem}
.gname.sm h3,.gname.sm .h3{margin:0}
.hero{gap:1.1rem;padding:1.3rem 1.2rem 1.4rem}
.herotop{display:flex;align-items:center;gap:1rem}
.ringwrap{flex:none;color:var(--accent-ink)}
.ringarc{transition:stroke-dasharray .8s ease}
.plan{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.5rem}
.hero .plan li{display:flex;align-items:center;gap:.8rem;background:color-mix(in srgb, var(--accent-ink) 10%, transparent);border-radius:14px;padding:.55rem .7rem}
.hero .plan li.ok{opacity:.72}
.plan .pt{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.3}
.plan .pt span{font-size:.85rem;opacity:.85}
.plan .pdone{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.bilan{background:color-mix(in srgb, var(--warm) 12%, var(--surface));border-color:color-mix(in srgb, var(--warm) 35%, var(--line))}
.profhead{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.profhead>div:first-child{min-width:0}
.bignum{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.bignum span{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1}
.bignum small{color:var(--muted);font-weight:700;font-size:.8rem}
.bars{display:flex;flex-direction:column;gap:.8rem}
.bar{display:flex;flex-direction:column;gap:.3rem}
.bl{display:flex;justify-content:space-between;align-items:baseline;gap:.75rem}
.bl>span.num{white-space:nowrap}
.bn{display:inline-flex;align-items:center;gap:.5rem;font-weight:700;min-width:0}
.bn i{width:.7rem;height:.7rem;border-radius:3px;flex:none}
.bt{position:relative;height:.7rem;border-radius:99px;background:var(--tint);overflow:visible}
.bt.lg{height:1rem}
.bt>span{display:block;height:100%;border-radius:99px}
.bt>span.grow{animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.bt em{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;background:var(--ink);border-radius:2px;opacity:.65}
@keyframes grow{from{width:0}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.tile2{display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1rem;min-height:9.5rem;min-width:0}
.tile2 .pi{margin-bottom:.35rem}
.tile2 b{font-size:1.02rem}
.tile2 .lvl{margin-top:auto;font-size:.8rem;font-weight:700;color:var(--muted)}
.tile2:active{background:var(--tint)}
.row .pi{width:2.3rem;height:2.3rem;border-radius:10px}
.donehead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.4rem}
.ringbig{color:var(--accent);margin-bottom:.4rem}
.confetti{position:fixed;inset:0 0 auto 0;height:0;pointer-events:none;z-index:20}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 2.2s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
.ob{padding-top:.5rem}
.obdots{display:flex;gap:.4rem}
.obdots i{width:.55rem;height:.55rem;border-radius:50%;background:var(--line)}
.obdots i.on{background:var(--accent);width:1.4rem;border-radius:99px}
.obart{display:flex}
.obart img{border-radius:24px}
.obl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1rem}
.obl li{display:flex;gap:.9rem;align-items:flex-start}
a.btn{text-decoration:none}
@media (max-width:360px){.tiles{grid-template-columns:1fr}.herotop{flex-direction:column;align-items:flex-start}}
@media (prefers-reduced-motion: reduce){.confetti{display:none}.bt>span.grow{animation:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ===== Hibi : encre de Chine (sumi), papier washi, sceau rouge ===== */
:root{--bg:#F6F4EE;--surface:#FBFAF6;--tint:#ECE8DF;--line:#D3CEC3;--ink:#1A1A1A;--muted:#5E5A50;
 --accent:#1A1A1A;--accent-ink:#F6F4EE;--warm:#C8371F;--good:#3E6B4A;--bad:#B3412E;
 --k-ufov:#B5542C;--k-corsi:#34508A;--k-switch:#4E7A5A;--k-list:#8A3F62;--k-ink:#FBFAF6;--up:#3E6B4A;--down:#B3412E;
 --s1:#1A1A1A;--s2:#C8371F;--s3:#34508A;--s4:#4E7A5A;--s5:#8A3F62;--s6:#B5542C;

const avg=a=>a.reduce((s,x)=>s+x,0)/(a.length||1);

/* ---------- week ---------- */
function weekDays(){const n=new Date();const off=(n.getDay()+6)%7;const m=new Date(n.getFullYear(),n.getMonth(),n.getDate()-off);return Array.from({length:7},(_,i)=>new Date(m.getFullYear(),m.getMonth(),m.getDate()+i))}
const KIN='<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9 L9 12 L8 15 L13 14 L15 18 L20 16" fill="none" stroke="#B8913A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function weekHTML(){const L=["L","M","M","J","V","S","D"];const t=today();
 return '<div class="week" role="list">'+weekDays().map((d,i)=>{const k=dkey(d);const on=!!D.days[k];return `<div class="day${on?" on":""}${!on&&k<t?" kin":""}${k===t?" today":""}" role="listitem" aria-label="${d.toLocaleDateString("fr-FR",{weekday:"long"})}${on?", séance faite":""}"><i></i><small>${L[i]}</small></div>`}).join("")+"</div>"}
function weekCount(){return weekDays().filter(d=>D.days[dkey(d)]).length}

/* ---------- profil & plan du jour ---------- */
const KCOL={ufov:"var(--k-ufov)",corsi:"var(--k-corsi)",switch:"var(--k-switch)",list:"var(--k-list)"};
const GKEYS=["ufov","corsi","switch","list"];
function played(g){return D.history.some(h=>h.g===g)}
function idx(g){const L=D.levels;let v;
 if(g==="ufov")v=(800-L.ufov)/760*100;
 else if(g==="corsi")v=(L.corsi-2)/7*100;
 else if(g==="switch"){const lv=L.switch||1;v=(lv-1)/5*85+(lv>=4?clamp((1600-(L.swVis||1600))/1300,0,1)*15:0)}
 else v=(L.list-4)/12*100;
 return Math.round(clamp(v,0,100))}
const rating=v=>v<25?"Débutant":v<50?"Intermédiaire":v<75?"Avancé":"Expert";
function overall(){const p=GKEYS.filter(played);return p.length?Math.round(avg(p.map(idx))):null}
function sessionOrder(){const rest=["corsi","switch","list"];const n=Math.floor(Date.now()/864e5)%3;let r=rest.slice(n).concat(rest.slice(0,n));
 if(rest.every(played)){const w=rest.reduce((a,b)=>idx(b)<idx(a)?b:a);r=[w].concat(r.filter(x=>x!==w))}
 return ["ufov"].concat(r)}
function todayPlan(){if(!D.today||D.today.d!==today()){D.today={d:today(),order:sessionOrder(),done:[]};save()}return D.today}
const todayDone=()=>todayPlan().done;
function ring(n,N,size,label){const f=N?n/N:0,s=size,c=s/2,R=s*0.36,C=2*Math.PI*R,a=(-90+360*f)*Math.PI/180,w=Math.max(2,s/110);
 return `<div class="disc" style="width:${s}px;height:${s}px"><div class="disc-in"></div><svg viewBox="0 0 ${s} ${s}" width="${s}" height="${s}" role="img" aria-label="${n} exercices sur ${N}"><circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="var(--line)" stroke-width="${w}"/>${f>0?`<circle class="ringarc" cx="${c}" cy="${c}" r="${R}" fill="none" stroke="var(--ink)" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${(C*f).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${c} ${c})"/><circle cx="${(c+R*Math.cos(a)).toFixed(1)}" cy="${(c+R*Math.sin(a)).toFixed(1)}" r="${(s/56).toFixed(1)}" fill="var(--accent2)"/>`:""}<text x="${c}" y="${(c+s*0.065).toFixed(1)}" text-anchor="middle" font-size="${(s*0.2).toFixed(1)}" font-weight="200" fill="var(--ink)" letter-spacing="-2" font-family="Hanken Grotesk, system-ui, sans-serif">${n}<tspan fill="var(--muted)"> / ${N}</tspan></text>${label?`<text x="${c}" y="${(c+s*0.16).toFixed(1)}" text-anchor="middle" font-size="${(s*0.05).toFixed(1)}" fill="var(--muted)" font-family="Hanken Grotesk, system-ui, sans-serif">${label}</text>`:""}</svg></div>`}
function bilanDue(){const b=D.bilans||[];if(!b.length)return "first";const [y,m,d]=b[b.length-1].d.split("-").map(Number);return (Date.now()-new Date(y,m-1,d))/864e5>=28?"monthly":null}
function profileHTML(){
 const o=overall();const pl=GKEYS.filter(played);
 const best=pl.length>1?pl.reduce((a,b)=>idx(b)>idx(a)?b:a):null,weak=pl.length>1?pl.reduce((a,b)=>idx(b)<idx(a)?b:a):null;
 return `<section class="card stack" aria-labelledby="h-prof">
  <div class="profhead"><div><h2 class="h3" id="h-prof">Profil cognitif</h2><span class="small muted">Indice Hibi sur 100, d'après votre niveau</span></div>${o!==null?`<div class="bignum"><span class="num">${o}</span><small>${rating(o)}</small></div>`:""}</div>
  <div class="bars">${GKEYS.map(g=>{const p=played(g),v=idx(g);return `<div class="bar"><div class="bl"><span class="bn"><i style="background:${KCOL[g]}"></i>${GAMES[g].skill}</span><span class="num small">${p?`<b>${v}</b> · ${rating(v)}`:'<span class="muted">à évaluer</span>'}</span></div><div class="bt"><span style="width:${p?Math.max(3,v):0}%;background:${KCOL[g]}"></span></div></div>`}).join("")}</div>
  ${best&&best!==weak?`<p class="small"><b>Point fort :</b> ${GAMES[best].skill.toLowerCase()}. <b>À travailler :</b> ${GAMES[weak].skill.toLowerCase()}, placé juste après Champ visuel dans vos séances.</p>`:`<p class="small muted">Le profil se remplit au fil des exercices.</p>`}
 </section>`;
}
function startBilan(){session={order:GKEYS.slice(),i:0,results:[],bilan:true,before:Object.fromEntries(GKEYS.map(g=>[g,played(g)?idx(g):null]))};intro("ufov")}

   <div class="tiles">${GKEYS.map(g=>`<button class="tile2" data-g="${g}"><span class="pi" style="background:${KCOL[g]}">${ICON[g]}</span><b>${GAMES[g].name}</b><span class="small muted">${GAMES[g].skill}</span><span class="lvl num">${played(g)?rating(idx(g))+" · "+idx(g):"Nouveau"}</span></button>`).join("")}</div>
  </section>
 </div>`,"home");
 $("#go").onclick=()=>{if(all){P.done=[];save()}const start=all?0:P.order.indexOf(nextG);session={order:P.order,i:start,results:[]};intro(P.order[start])};

}
function levelText(g){const L=D.levels;if(g==="ufov")return L.ufov+" ms";if(g==="corsi")return L.corsi+" cases";if(g==="list")return L.list+" articles";return "niveau "+(L.switch||1)+" / 6"}

/* ---------- intro ---------- */
function posLabel(){return session?(session.bilan?"Bilan · ":"")+`Exercice ${session.i+1} sur ${session.order.length}`:"Exercice libre"}
function intro(g){
 const G=GAMES[g];
 show(`<div class="stack-lg">
  <div class="gtop"><button class="linkbtn" id="back">‹ Retour</button><span>${posLabel()}</span></div>
  <div class="gname"><span class="pi lg" style="background:${KCOL[g]}">${ICON[g]}</span><div><p class="eyebrow">${G.skill}</p><h1 class="h2">${G.name}</h1></div></div>
  <div class="illu" style="background:color-mix(in srgb, ${KCOL[g]} 16%, var(--surface))" aria-hidden="true">${G.illu}</div>

/* ---------- 1. Champ visuel ---------- */
const POS=Array.from({length:8},(_,i)=>{const a=(i*45-90)*Math.PI/180;return {x:50+38*Math.cos(a),y:50+38*Math.sin(a)}});

const RUN={};
RUN.ufov=async function(id){
 let dur=PR?750:clamp(D.levels.ufov,40,800);const N=PR?3:12;const durs=[];let streak=0,ok=0;
 msg("Fixez le centre.");
 for(let t=0;t<N;t++){
  if(!alive(id))return;trial(`Essai ${t+1} / ${N}`);
  const center=Math.random()<.5?"rond":"carre";const pos=Math.floor(Math.random()*8);const distract=dur<=300;

  let inner=at({x:50,y:50},SH[center])+at(POS[pos],SH.star);
  if(distract)POS.forEach((p,i)=>{if(i!==pos)inner+=at(p,SH.tri)});
  $("#stage").innerHTML=ufovHTML(inner);
  await wait(dur);if(!alive(id))return;
  let m="";const ch=["▲","■","●","✦","◆"];for(let k=0;k<46;k++)m+=`<span class="maskch" style="left:${8+Math.random()*84}%;top:${8+Math.random()*84}%">${ch[k%5]}</span>`;
  $("#stage").innerHTML=ufovHTML(m);
  await wait(400);if(!alive(id))return;

  msg("Au centre, c'était :");
  const a1=await ask([{v:"rond",label:'<svg width="28" height="28" viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="currentColor"/></svg> Un rond'},{v:"carre",label:'<svg width="28" height="28" viewBox="0 0 40 40"><rect x="6" y="6" width="28" height="28" rx="3" fill="currentColor"/></svg> Un carré'}]);
  if(!alive(id))return;

  const a2=await new Promise(res=>{$("#stage").innerHTML=ufovHTML(POS.map((p,i)=>at(p,`<button aria-label="Position ${i+1}" data-i="${i}"></button>`)).join(""));$("#stage").querySelectorAll("button").forEach(b=>b.onclick=()=>res(+b.dataset.i))});
  if(!alive(id))return;
  const good=a1===center&&a2===pos;durs.push(dur);
  $("#stage").innerHTML=ufovHTML(at(POS[pos],SH.star));
  await flash(good,good?"Juste":(a1!==center&&a2!==pos?"La forme et la position étaient différentes":a1!==center?"La position était juste, pas la forme":"La forme était juste, l'étoile était ici"));
  if(PR){if(good)ok++}else if(good){ok++;streak++;if(streak>=2){dur=Math.max(30,Math.round(dur*.85));streak=0}}else{streak=0;dur=Math.min(900,Math.round(dur*1.15))}

RUN.corsi=async function(id){

 const draw=()=>{$("#stage").innerHTML='<div class="grid9">'+Array.from({length:9},(_,i)=>`<button class="tile" data-i="${i}" aria-label="Case ${i+1}" disabled></button>`).join("")+"</div>"};

  if(!alive(id))return;

const RULES={

function askT(opts,ms){return new Promise(res=>{let done=false;const tm=ms?setTimeout(()=>{if(done)return;done=true;const c=$("#controls");if(c)c.innerHTML="";res("__late")},ms):null;ask(opts).then(v=>{if(done)return;done=true;clearTimeout(tm);res(v)})})}
RUN.switch=async function(id){
 let lv=PR?1:clamp(D.levels.switch||1,1,6);const start=lv;let top=lv;const BLOCKS=PR?1:4,PER=PR?4:8,N=BLOCKS*PER;
 const digits=[1,2,3,4,6,7,8,9],vow="AEIOU",con="BDFKMRST";
 let prev=null,pts=0,late=0,shown=0,tok=0;const R=[];
 let vis=clamp(D.levels.swVis||1600,300,2200);
 for(let b=0;b<BLOCKS;b++){
  const cfg=SW_LV[lv];
  if(shown!==lv){
   shown=lv;trial(`Niveau ${lv} / 6`);msg(b===0?"Voici votre niveau de départ.":(lv>R[R.length-1].lv?"Bravo, on monte d'un cran.":"On redescend d'un cran pour consolider."));
   $("#stage").innerHTML=`<div class="bigcard"><span class="eyebrow">Niveau ${lv} sur 6</span><p>${cfg.desc}</p>${cfg.cue==="color"||cfg.cue==="flash"?LEGEND:""}</div>`;
   await ask([{v:1,label:"C'est parti",cls:"one"}]);if(!alive(id))return;
  }
  let bc=0;
  for(let t=0;t<PER;t++){
   if(!alive(id))return;const n=b*PER+t+1;trial(`Niveau ${lv} · ${n} / ${N}`);msg("");
   const keep=prev&&cfg.rules.includes(prev)&&Math.random()>cfg.p;
   const pool=prev?cfg.rules.filter(r=>r!==prev):cfg.rules;
   const rule=keep?prev:pool[Math.floor(Math.random()*pool.length)];
   const d=digits[Math.floor(Math.random()*8)];
   const l=Math.random()<.5?vow[Math.floor(Math.random()*5)]:con[Math.floor(Math.random()*8)];
   const Rl=RULES[rule];
   const cueTxt=cfg.cue==="text"?Rl.long:cfg.cue==="q"?Rl.q:Rl.sym;
   const stim=cfg.pair?`${l}${d}`:`${d}`;
   const leg=cfg.cue==="color"||cfg.cue==="flash"?LEGEND:"";
   const bar=cfg.dl?`<div class="timebar"><i style="animation-duration:${cfg.dl}ms"></i></div>`:`<div class="timebar off"></div>`;
   const colored=cfg.cue==="color"||cfg.cue==="flash";
   if(colored){
    trial(`Niveau ${lv} · ${n} / ${N} · affichage ${(vis/1000).toLocaleString("fr-FR",{maximumFractionDigits:1})} s`);
    $("#stage").innerHTML=`<div class="stack" style="gap:.6rem"><div class="bigcard rc ${rule}"><span class="rsym">${Rl.sym}</span><span class="digit num">${stim}</span></div>${bar}${leg}</div>`;
   }else{
    $("#stage").innerHTML=`<div class="stack" style="gap:.6rem"><div class="rule ${rule}">${cueTxt}</div><div class="bigcard"><span class="digit num">${stim}</span></div>${bar}${leg}</div>`;
   }
   const tk=++tok;
   if(colored)setTimeout(()=>{if(tk!==tok||!alive(id))return;const c=$(".rc");if(!c)return;c.querySelector(".digit").textContent="?";if(cfg.cue==="flash"){c.className="bigcard rc";c.querySelector(".rsym").textContent=""}},vis);
   const opts=cfg.cue==="text"?[{v:"oui",label:Rl.labels[0]},{v:"non",label:Rl.labels[1]}]:[{v:"oui",label:"Oui"},{v:"non",label:"Non"}];
   const t0=performance.now();
   const a=await askT(opts,cfg.dl);tok++;if(!alive(id))return;
   const rt=performance.now()-t0;
   const good=a!=="__late"&&((a==="oui")===Rl.ok(d,l));
   if(a==="__late")late++;
   if(good){bc++;pts+=lv}
   if(colored)vis=good?Math.max(300,Math.round(vis*.88)):Math.min(2200,Math.round(vis*1.15));
   R.push({rt,good,lv,sw:prev!==null&&rule!==prev,late:a==="__late"});
   await flash(good,a==="__late"?"Trop tard":good?"Juste":`Non : la règle était « ${Rl.long.toLowerCase()} »`);
   prev=rule;
  }
  const acc=bc/PER;
  if(!PR){if(acc>=.875&&lv<6)lv++;else if(acc<.625&&lv>1)lv--}
  top=Math.max(top,lv);
 }
 if(PR)return {practice:true};

 const correct=R.filter(r=>r.good).length;
 const sw=R.filter(r=>r.sw&&r.good).map(r=>r.rt),st=R.filter(r=>!r.sw&&r.good).map(r=>r.rt);
 const cost=sw.length&&st.length?Math.round(avg(sw)-avg(st)):null;
 return {score:pts,lines:[`Niveau : départ ${start}, plus haut atteint ${top}, prochaine fois ${lv} (sur 6)`,`${correct} bonnes réponses sur ${N}${late?`, dont ${late} réponse${late>1?"s":""} trop tardive${late>1?"s":""}`:""}`,"Chaque bonne réponse rapporte autant de points que le niveau où vous êtes.",...(top>=4?[`Temps d'affichage de la paire en fin d'exercice : ${(vis/1000).toLocaleString("fr-FR",{maximumFractionDigits:2})} s`]:[]),cost!==null?`Quand la règle change, vous mettez ${fmt(Math.max(0,cost))} ms de plus. Ce délai baisse avec l'entraînement.`:"Pas assez de changements de règle pour mesurer le temps de bascule."]};

function chart(g){
 const col=KCOL[g];const pts=D.history.filter(h=>h.g===g).slice(-12);const G=GAMES[g];
 if(pts.length<2)return `<p class="small muted">${pts.length?"Encore une partie et la courbe apparaît.":"Pas encore de partie. La courbe apparaîtra après deux exercices."}</p>`;
 const W=320,H=120,pl=40,pr=12,pt=12,pb=22;const vals=pts.map(p=>p.s);
 let mn=Math.min(...vals),mx=Math.max(...vals);if(mn===mx){mn-=1;mx+=1}
 const inv=G.better==="lower";
 const y=v=>{const f=(v-mn)/(mx-mn);return pt+(inv?f:1-f)*(H-pt-pb)};
 const x=i=>pl+i*(W-pl-pr)/(pts.length-1);
 const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(p.s).toFixed(1)}`).join(" ");
 const area=line+` L${x(pts.length-1).toFixed(1)} ${H-pb} L${pl} ${H-pb} Z`;
 const best=inv?mn:mx,worst=inv?mx:mn;
 return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution ${G.name}, ${pts.length} dernières parties">
  <line x1="${pl}" x2="${W-pr}" y1="${pt}" y2="${pt}" stroke="var(--line)" stroke-dasharray="3 4"/>
  <line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>
  <text x="${pl-6}" y="${pt+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(Math.round(best))}</text>
  <text x="${pl-6}" y="${H-pb+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(Math.round(worst))}</text>
  <text x="${pl}" y="${H-5}" font-size="11" fill="var(--muted)">${pts.length} dernières parties</text>
  <path d="${area}" fill="${col}" fill-opacity=".14"/>
  <path d="${line}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  ${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.s).toFixed(1)}" r="${i===pts.length-1?5:2.5}" fill="${col}"/>`).join("")}
 </svg></div>`;
}

const VERSION="5.1";
const CFG=window.VIVACE_CONFIG||{};
const shareOn=()=>!!(CFG.supabaseUrl&&CFG.supabaseAnonKey);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==="x"?r:(r&3|8)).toString(16)}));
async function rpc(fn,args){
 if(!shareOn())throw new Error("noconfig");
 let r;
 try{r=await fetch(CFG.supabaseUrl.replace(/\/$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"Content-Type":"application/json",apikey:CFG.supabaseAnonKey,Authorization:"Bearer "+CFG.supabaseAnonKey},body:JSON.stringify(args)})}catch(e){throw new Error("offline")}
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok)throw new Error((j&&j.message)||"server");
 return j;
}
function errText(e){const m=e&&e.message||"";
 if(m==="offline")return "Pas de connexion internet. Réessayez quand vous êtes connecté.";
 if(m==="noconfig")return "Le partage n'est pas encore activé sur cette installation.";
 if(/sauvegarde introuvable/i.test(m))return "Aucune sauvegarde ne correspond à ce code. Vérifiez les 12 caractères.";
 if(/introuvable/i.test(m))return "Ce code de groupe n'existe pas. Vérifiez les 8 caractères.";
 if(/prenom/i.test(m))return "Indiquez un prénom de 1 à 40 caractères.";
 if(/could not find the function|schema cache/i.test(m))return "La sauvegarde n'est pas encore activée sur le serveur.";
 return "Le serveur n'a pas répondu correctement. Réessayez dans un instant.";
}

const SERIES=["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)","var(--s6)"];

function fmtDay(k){const t=today();if(k===t)return "aujourd'hui";const y=dkey(new Date(Date.now()-864e5));if(k===y)return "hier";const [a,b,c]=k.split("-").map(Number);return new Date(a,b-1,c).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}
function multiChart(g,mem){
 const S=mem.map(m=>({name:m.name,color:m.color,pts:m.res.filter(r=>r.g===g).sort((a,b)=>a.d<b.d?-1:1).slice(-10).map(r=>r.s)})).filter(s=>s.pts.length);
 if(!S.length)return '<p class="small muted">Personne n\'a encore joué à cet exercice.</p>';
 const W=320,H=130,pl=40,pr=12,pt=12,pb=22;const all=S.flatMap(s=>s.pts);
 let mn=Math.min(...all),mx=Math.max(...all);if(mn===mx){mn-=1;mx+=1}
 const inv=GAMES[g].better==="lower";const len=Math.max(...S.map(s=>s.pts.length));
 const y=v=>{const f=(v-mn)/(mx-mn);return pt+(inv?f:1-f)*(H-pt-pb)};
 const x=i=>len===1?(pl+W-pr)/2:pl+i*(W-pl-pr)/(len-1);
 const best=inv?mn:mx,worst=inv?mx:mn;
 const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${GAMES[g].name}, dernières parties de chaque membre">
  <line x1="${pl}" x2="${W-pr}" y1="${pt}" y2="${pt}" stroke="var(--line)" stroke-dasharray="3 4"/>
  <line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>
  <text x="${pl-6}" y="${pt+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(Math.round(best))}</text>
  <text x="${pl-6}" y="${H-pb+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(Math.round(worst))}</text>
  <text x="${pl}" y="${H-5}" font-size="11" fill="var(--muted)">Parties successives, 10 au maximum</text>
  ${S.map(s=>`${s.pts.length>1?`<path d="${s.pts.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:""}<circle cx="${x(s.pts.length-1).toFixed(1)}" cy="${y(s.pts[s.pts.length-1]).toFixed(1)}" r="4" fill="${s.color}"/>`).join("")}
 </svg>`;
 return `<div class="chart">${svg}</div><div class="legend2">${S.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)} <span class="muted num">${fmt(s.pts[s.pts.length-1])}</span></span>`).join("")}</div>`;
}


/* ---------- programme : fondation 8 semaines, entretien, rappels ---------- */
const BOOST_WEEKS=[13,27,53];
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function parseDay(k){const [a,b,c]=k.split("-").map(Number);return new Date(a,b-1,c)}
function programStart(){
 if(D.program&&D.program.start)return parseDay(D.program.start);
 const ds=Object.keys(D.days).sort();if(!ds.length)return null;
 D.program={start:dkey(mondayOf(parseDay(ds[0])))};save();return parseDay(D.program.start);
}
function programWeek(){const s=programStart();if(!s)return 0;return Math.floor((mondayOf(new Date())-s)/(7*864e5))+1}
function phaseOf(w){if(w<=0)return "avant";if(w<=8)return "fondation";if(BOOST_WEEKS.includes(w)||(w>53&&(w-53)%26===0))return "rappel";return "entretien"}
function weekGoal(){const ph=phaseOf(programWeek());return ph==="entretien"?2:5}
function foundationDone(){const s=programStart();if(!s)return 0;const end=new Date(s);end.setDate(end.getDate()+56);return Object.keys(D.days).filter(k=>{const d=parseDay(k);return d>=s&&d<end}).length}
function nextBoost(w){const all=BOOST_WEEKS.concat([79,105,131]);return all.find(x=>x>w)}
function weekDate(w){const s=programStart();const d=new Date(s);d.setDate(d.getDate()+(w-1)*7);return d}
const fmtShort=d=>d.toLocaleDateString("fr-FR",{day:"numeric",month:"long"});
function programHead(){
 const w=programWeek(),ph=phaseOf(w);
 if(ph==="avant")return `<p class="small muted">Votre programme de 8 semaines démarre avec votre première séance.</p>`;
 if(ph==="fondation"){const n=foundationDone();return `<div class="stack" style="gap:.4rem"><div class="bl"><span class="eyebrow">Programme · fondation, semaine ${w} sur 8</span><span class="num small muted">${n} / 40 séances</span></div><div class="bt"><span class="grow" style="width:${Math.max(2,Math.min(100,n/40*100))}%;background:var(--ink)"></span></div></div>`}
 if(ph==="rappel")return `<div class="stack" style="gap:.2rem"><span class="eyebrow">Programme · semaine de rappel</span><p class="small">Cinq séances cette semaine pour ancrer vos acquis, comme les séances de rappel de l'étude ACTIVE.</p></div>`;
 const nb=nextBoost(w);return `<div class="stack" style="gap:.2rem"><span class="eyebrow">Programme · entretien</span><p class="small muted">Deux séances par semaine suffisent. Prochaine semaine de rappel : semaine du ${fmtShort(weekDate(nb))}.</p></div>`;
}
function programCard(){
 const s=programStart();
 if(!s)return `<section class="card stack"><h2 class="h3">Votre programme</h2><p class="small muted">Il démarre avec votre première séance : 8 semaines de fondation, puis un entretien léger et des semaines de rappel.</p></section>`;
 const w=programWeek(),ph=phaseOf(w),n=foundationDone();
 const end=weekDate(9);end.setDate(end.getDate()-1);
 const rows=[
  {t:"Fondation",d:`5 séances par semaine, du ${fmtShort(s)} au ${fmtShort(end)}`,st:w>8?"fait":ph==="fondation"?"en cours":""},
  {t:"Entretien",d:"2 séances par semaine",st:ph==="entretien"?"en cours":w>8?"":""}]
  .concat(BOOST_WEEKS.map((b,i)=>({t:`Rappel ${["du 3ᵉ mois","du 6ᵉ mois","du 12ᵉ mois"][i]}`,d:`5 séances la semaine du ${fmtShort(weekDate(b))}`,st:w>b?"fait":w===b?"en cours":""})));
 return `<section class="card stack" style="gap:.6rem"><div class="profhead"><div><h2 class="h3">Votre programme</h2><span class="small muted">Inspiré de l'étude ACTIVE : un entraînement régulier, puis des séances de rappel.</span></div>${ph==="fondation"?`<div class="bignum"><span class="num">${n}</span><small>sur 40</small></div>`:""}</div>
  <div class="rows">${rows.map(r=>`<div class="row" style="min-height:3.2rem"><span class="t"><b>${r.t}</b><span>${r.d}</span></span><span class="small ${r.st==="en cours"?"st-on":"muted"}">${r.st}</span></div>`).join("")}</div></section>`;
}
function programIcs(time){
 const [hh,mm]=time.split(":").map(Number);const z=n=>String(n).padStart(2,"0");
 const dt=d=>`${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}T${z(hh)}${z(mm)}00`;
 const dd=d=>`${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}T235900`;
 const now=new Date();const stamp=`${now.getUTCFullYear()}${z(now.getUTCMonth()+1)}${z(now.getUTCDate())}T${z(now.getUTCHours())}${z(now.getUTCMinutes())}${z(now.getUTCSeconds())}Z`;
 const url=location.origin+location.pathname;
 let s=programStart()||mondayOf(new Date());
 const tomorrow=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
 const fEnd=new Date(s);fEnd.setDate(fEnd.getDate()+55);
 const ev=(uid,start,rrule,sum,desc)=>["BEGIN:VEVENT",`UID:${uid}-${Date.now()}@hibi`,`DTSTAMP:${stamp}`,`DTSTART:${dt(start)}`,"DURATION:PT10M",`RRULE:${rrule}`,`SUMMARY:${sum}`,`DESCRIPTION:${desc} ${url}`,`URL:${url}`,"BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${sum}`,"TRIGGER:PT0M","END:VALARM","END:VEVENT"];
 let L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Hibi//FR","CALSCALE:GREGORIAN"];
 const fStart=tomorrow>s?tomorrow:s;
 if(fStart<=fEnd)L=L.concat(ev("fondation",fStart,`FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR;UNTIL=${dd(fEnd)}`,"Hibi : séance du jour","Fondation, 10 minutes."));
 const eStart=new Date(fEnd);eStart.setDate(eStart.getDate()+2);
 L=L.concat(ev("entretien",eStart>tomorrow?eStart:tomorrow,"FREQ=WEEKLY;BYDAY=TU,SA","Hibi : séance d'entretien","Deux séances par semaine."));
 BOOST_WEEKS.forEach((b,i)=>{const d=new Date(s);d.setDate(d.getDate()+(b-1)*7);if(d>now)L=L.concat(ev("rappel"+b,d,"FREQ=DAILY;COUNT=5","Hibi : semaine de rappel","Cinq séances cette semaine pour ancrer vos acquis."))});
 L.push("END:VCALENDAR");return L.join("\r\n");
}

/* ---------- sauvegarde personnelle : un code, sans compte ---------- */
const BK_ALPHA="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function newBackupCode(){const a=new Uint8Array(12);crypto.getRandomValues(a);return Array.from(a,x=>BK_ALPHA[x%31]).join("")}
const fmtCode=c=>c.replace(/(.{4})(?=.)/g,"$1-");
function backupPayload(){return {v:1,at:new Date().toISOString(),settings:D.settings,levels:D.levels,history:D.history,days:D.days,bilans:D.bilans,name:D.name,practiced:D.practiced||{},program:D.program||null,family:D.family||null,remTime:D.remTime||null}}
let bkTimer=null;
function backupSoon(){if(!D.backup||!shareOn())return;clearTimeout(bkTimer);bkTimer=setTimeout(backupNow,2500)}
async function backupNow(){if(!D.backup)return false;try{await rpc("vivace_backup_save",{p_code:D.backup.code,p_data:backupPayload()});D.backup.last=new Date().toISOString();save();return true}catch(e){D.backup.error=errText(e);save();return false}}
function backupSection(){
 if(!shareOn())return "";
 const B=D.backup;
 return `<section class="card stack" style="gap:.7rem" id="bk"><h2 class="h3">Sauvegarde</h2>
  ${B?`<p class="small muted">Vos résultats sont sauvegardés automatiquement après chaque exercice. Gardez ce code : il permet de les retrouver sur un autre téléphone.</p>
   <div class="codebox"><span><span class="small muted">Votre code de sauvegarde</span><br><b>${fmtCode(B.code)}</b></span><button class="btn quiet" id="bk-copy" style="width:auto;padding-inline:1.2rem">Copier</button></div>
   <p class="small muted" id="bk-status">${B.last?"Dernière sauvegarde : "+new Date(B.last).toLocaleString("fr-FR",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}):"Pas encore de sauvegarde."}</p>
   <button class="btn quiet" id="bk-now">Sauvegarder maintenant</button><div id="bkd"><button class="linkbtn" id="bk-del">Supprimer ma sauvegarde du serveur</button></div>`
  :`<p class="small muted">Aujourd'hui, vos résultats ne vivent que dans ce téléphone. Activez la sauvegarde pour les retrouver si vous changez d'appareil. Pas de compte : un code de 12 caractères suffit.</p><button class="btn" id="bk-on">Activer la sauvegarde</button>`}
  <details><summary class="small" style="cursor:pointer;font-weight:600">Récupérer mes résultats avec un code</summary>
   <div class="stack" style="gap:.6rem;margin-top:.7rem"><label class="f" for="bk-in">Code de sauvegarde<input class="t code" id="bk-in" maxlength="14" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX"></label>
   <button class="btn quiet" id="bk-load">Récupérer</button><div id="bk-res"></div></div>
  </details>
 </section>`;
}
function wireBackup(){
 if(!shareOn())return;
 const on=$("#bk-on");if(on)on.onclick=async()=>{on.disabled=true;on.textContent="Un instant…";D.backup={code:newBackupCode(),last:null};save();const ok=await backupNow();if(!ok){const e=D.backup.error;D.backup=null;save();settings();const r=$("#bk");if(r)r.insertAdjacentHTML("beforeend",`<p class="err">${esc(e||"La sauvegarde a échoué.")}</p>`);return}settings();setTimeout(()=>{const b=$("#bk");if(b)b.scrollIntoView({block:"center"})},50)};
 const cp=$("#bk-copy");if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(fmtCode(D.backup.code));cp.textContent="Copié"}catch(e){cp.textContent="Sélectionnez le code"}};
 const now=$("#bk-now");if(now)now.onclick=async()=>{now.disabled=true;now.textContent="Sauvegarde…";const ok=await backupNow();$("#bk-status").textContent=ok?"Sauvegardé à l'instant.":D.backup.error;now.disabled=false;now.textContent="Sauvegarder maintenant"};
 const del=$("#bk-del");if(del)del.onclick=()=>{$("#bkd").innerHTML=`<div class="confirm"><p>Supprimer définitivement la copie en ligne ? Vos résultats restent sur ce téléphone.</p><button class="btn danger" id="bkd-yes">Oui, supprimer</button><button class="btn quiet" id="bkd-no">Annuler</button><p class="err" id="bkd-err" hidden></p></div>`;
  $("#bkd-no").onclick=settings;$("#bkd-yes").onclick=async()=>{try{await rpc("vivace_backup_delete",{p_code:D.backup.code});D.backup=null;save();settings()}catch(e){const x=$("#bkd-err");x.hidden=false;x.textContent=errText(e)}}};
 const ld=$("#bk-load");if(ld)ld.onclick=async()=>{
  const res=$("#bk-res");const code=$("#bk-in").value.toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(code.length!==12){res.innerHTML='<p class="err">Le code fait 12 caractères.</p>';return}
  ld.disabled=true;ld.textContent="Recherche…";
  try{const data=await rpc("vivace_backup_load",{p_code:code});
   const n=(data.history||[]).length,when=data.at?new Date(data.at).toLocaleDateString("fr-FR",{day:"numeric",month:"long"}):"";
   res.innerHTML=`<div class="confirm"><p>Sauvegarde trouvée : ${n} exercice${n>1?"s":""}${when?", du "+when:""}. Remplacer les résultats de ce téléphone ?</p><button class="btn" id="bk-yes">Oui, récupérer</button><button class="btn quiet" id="bk-no">Annuler</button></div>`;
   $("#bk-no").onclick=settings;
   $("#bk-yes").onclick=()=>{const keep=D.settings;Object.assign(D,{settings:Object.assign({},keep,data.settings||{}),levels:data.levels||D.levels,history:data.history||[],days:data.days||{},bilans:data.bilans||[],name:data.name||D.name,practiced:data.practiced||{},program:data.program||null,family:data.family||D.family,remTime:data.remTime||D.remTime,onboarded:true,backup:{code,last:new Date().toISOString()},today:null});save();document.documentElement.dataset.size=D.settings.size;themeNow();home()};
  }catch(e){res.innerHTML=`<p class="err">${esc(errText(e))}</p>`;ld.disabled=false;ld.textContent="Récupérer"}
 };
}

/* ---------- thème : clair le jour, sombre et chaud le soir ---------- */
function themeNow(){
 const t=D.settings.theme||"auto",h=new Date().getHours(),night=h>=20||h<7,r=document.documentElement;
 const mode=t==="auto"?(night?"soir":"light"):t;
 if(mode==="system"){delete r.dataset.theme;r.classList.remove("soir")}
 else if(mode==="soir"){r.dataset.theme="dark";r.classList.add("soir")}
 else{r.dataset.theme=mode;r.classList.remove("soir")}
 requestAnimationFrame(()=>{const bg=getComputedStyle(document.body).backgroundColor;document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.setAttribute("content",bg))});
}
themeNow();setInterval(themeNow,60000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)themeNow()});

/* ---------- démarrage ---------- */
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
flush();
if(new URLSearchParams(location.search).get("famille")&&!D.family){D.onboarded=true;save();famille()}else if(!D.onboarded)onboarding(0);else home();
})();
</script>
</body>
</html>
